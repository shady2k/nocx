    content: "On this NixOS dev host 'make ci' (and therefore 'make ci-full', which runs it first and stops on failure) CANNOT pass, and it is not the code. The host lacks binaries the tests require and the tests say so themselves: /bin/bash (5 tests in internal/app), the GNU bash 3.2 fixture ('no GNU bash 3.2 found ... The container images install the fixture' — every internal/shellintegration TestBashChannel_*), and dash ('dash is required by this test and missing from PATH ... must not silently skip' — the launcher tests). Add TestLiveSshd_ZshAdapterReachesAcceptedDomain, which times out on a loaded host. make ci covers CI's macOS 'backend' job, and this machine is not that runner. So the local gate here is the THREE CONTAINERIZED jobs run individually — scripts/ci-linux.sh, scripts/ci-frontend.sh, e2e/run-in-container.sh — which are byte-for-byte their CI counterparts in software. Measured 2026-08-28."
