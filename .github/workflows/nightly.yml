# ADR-0097: build once daily only after product changes; never rerun CI or write a cask.
name: Nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing anything
        type: boolean
        default: true
      linux-only:
        description: Iterate the Linux leg before paying for macOS signing
        type: boolean
        default: true
      proof-only:
        description: Prove the two published Linux nightlies alone; skips prepare, build and publish
        type: boolean
        default: false
permissions:
  contents: read
# The nightly and the stable promotion share one release group: promotion
# tags a commit the nightly published, so the two must never overlap. Queued,
# never cancelled (ADR-79b6cy61).
concurrency:
  group: nocx-release
  cancel-in-progress: false
jobs:
  prepare:
    # `proof-only` reads no plan: it proves what is published now, and a plan
    # that decided nothing moved would otherwise skip the proof with it.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.proof-only) }}
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.plan.outputs.moved }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0
          # The version comes from the reachable stable tags, so they are part
          # of the input, not an accident of the clone (ADR-79b6cy61).
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: plan
        name: Compare main with the last published nightly using CI's product predicate
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          LINUX_ONLY: ${{ inputs.linux-only }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { prepare, authorize, releaseKeys, verifyFile } from './scripts/publish-nightly.mjs';
          authorize({ ref: process.env.GITHUB_REF, dryRun: process.env.DRY_RUN === 'true', linuxOnly: process.env.LINUX_ONLY === 'true' });
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const sha = git(['rev-parse', 'HEAD']);
          const gh = args => execFileSync('gh', args, { encoding: 'utf8' });
          const releases = JSON.parse(gh(['api', '--paginate', '--slurp', 'repos/{owner}/{repo}/releases?per_page=100'])).flat();
          const last = releases.find(r => r.tag_name === 'nightly' && r.prerelease && !r.draft);
          let previous = null;
          if (last) {
            gh(['release', 'download', 'nightly', '--pattern', 'nightly.json*', '--dir', 'previous-nightly']);
            previous = verifyFile('previous-nightly', 'nightly.json', releaseKeys('internal/update/keyring.go')).sha;
            if (git(['rev-parse', 'nightly^{commit}']) !== previous) throw Error('nightly tag differs from signed provenance');
          }
          // A rewritten main is not a publishable successor.
          if (previous) git(['merge-base', '--is-ancestor', previous, sha]);
          const files = previous ? git(['diff', '--name-only', previous, sha]).split('\n').filter(Boolean) : [];
          // The version is read from the stable tags this commit can reach, by
          // nextVersion in the module: one owner, no VERSION file, no describe.
          const tags = git(['tag', '--list', '--merged', sha]).split('\n').filter(Boolean);
          const plan = prepare({ sha, previous, files, tags,
            date: new Date().toISOString().slice(0, 10).replaceAll('-', ''), runId: process.env.RUN_ID });
          if (process.env.DRY_RUN === 'true') plan.moved = true;
          for (const [key, value] of Object.entries(plan)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          console.log(JSON.stringify(plan));
          JS
  build:
    needs: prepare
    if: needs.prepare.outputs.moved == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}
      linux-only: ${{ github.event_name == 'workflow_dispatch' && inputs.linux-only }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    secrets: inherit
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.moved == 'true' && !inputs.linux-only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: helper-binaries
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: manifest
          path: dist
      - name: Refuse unsigned, changed or undeclared bytes; then publish or rehearse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH: ${{ github.event_name == 'schedule' || !inputs.dry-run }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { decide, publish, releaseKeys } from './scripts/publish-nightly.mjs';
          const input = { moved: true, sha: process.env.BUILD_SHA, version: process.env.VERSION,
            tag: process.env.RELEASE_TAG, runId: process.env.RUN_ID, runAttempt: process.env.RUN_ATTEMPT,
            dir: 'dist', keyring: releaseKeys('internal/update/keyring.go') };
          if (process.env.PUBLISH === 'true') console.log(await publish(input));
          else console.log({ rehearsal: true, ...decide(input) });
          JS

  # ADR-0097 builds a nightly; this asks the question the build cannot: can the
  # person holding the previous one be given this one? The real GTK/WebKit
  # window of the PREVIOUS published AppImage selects nightly in Settings,
  # checks, installs and presses the real Restart control, and the installed
  # file is hashed afterwards. Nothing is mocked, and no step of it counts as
  # passing unless the bytes on disk changed: docs/agents/update-proof.md says
  # what each assertion reads and from where.
  prove-linux:
    needs: [prepare, build, publish]
    # After a real publication, or on demand through `proof-only`, which skips
    # the three jobs above and proves the pair published right now. A skipped,
    # failed or rehearsed (`dry-run`) publish proves nothing, so it runs neither.
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.proof-only) ||
        (needs.publish.result == 'success' && (github.event_name == 'schedule' || !inputs.dry-run))
      )
    # x86_64 only: the artifact is linux/amd64. 24.04, NEWER than the 22.04 the
    # image is built on, so a pass means it also runs on a host it was not built
    # against; `ubuntu-latest` would let both of those change under the proof.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The harness belongs to the commit that published. In `proof-only`
          # there is no plan, and the dispatched ref is what gets proved.
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false

      # The window is a real GTK/WebKit one and the verifier is Go: the
      # action holds what the host needs, shared with the stable proof.
      - uses: ./.github/actions/linux-update-proof-runtime

      - name: Refuse to prove anything but two published nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          /usr/bin/python3 scripts/update-proof/prove-linux.py --publication-status
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::error::publication blocked: fewer than two dated nightlies are published, so there is no previous AppImage to update from. Blocked is not a pass."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the publication status could not be read (exit $status)"
            exit 1
          fi

      - name: Stage the two published nightlies and a published lower stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p proof-inputs/candidate proof-inputs/previous proof-inputs/lower proof-results
          # The pair is the newest dated nightly and the one before it, newest
          # first by `published_at`. The moving `nightly` alias is not a dated
          # tag: the harness requires it separately to serve the candidate's
          # exact bytes, so selecting by it here would check nothing.
          mapfile -t dated < <(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | select(.prerelease) | select(.tag_name | startswith("nightly-")) | "\(.published_at)\t\(.tag_name)"' \
              | sort -r | cut -f2
          )
          candidate="${dated[0]:-}"
          previous="${dated[1]:-}"
          if [ -z "$previous" ]; then
            echo "::error::fewer than two dated nightlies are published; there is no previous AppImage to update from"
            exit 1
          fi
          if [ -n "$PUBLISHED_TAG" ] && [ "$candidate" != "$PUBLISHED_TAG" ]; then
            echo "::error::the newest dated nightly is $candidate, but this run published $PUBLISHED_TAG; refusing to prove another run's artifact"
            exit 1
          fi
          for slot in candidate previous; do
            gh release download "${!slot}" \
              --pattern 'manifest.json' --pattern 'manifest.json.sig' \
              --dir "proof-inputs/$slot"
          done
          # The downgrade probe has to be a REAL published stable release,
          # signed by the production key and strictly below the nightly's
          # version; a manifest signed for this test would prove nothing.
          lower="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          gh release download "$lower" --pattern 'manifest.json' --pattern 'manifest.json.sig' --dir proof-inputs/lower
          /usr/bin/python3 - "$lower" <<'PY'
          import json, sys
          lower = json.load(open("proof-inputs/lower/manifest.json", encoding="utf-8"))
          candidate = json.load(open("proof-inputs/candidate/manifest.json", encoding="utf-8"))
          def semver(v): return tuple(int(p) for p in v.split("."))
          if not semver(lower["version"]) < semver(candidate["version"]):
              sys.exit(f"{sys.argv[1]} is {lower['version']}, not below the nightly's "
                       f"{candidate['version']}: the downgrade probe needs a published "
                       f"stable release below it, not a manifest signed here")
          print(f"lower probe: {sys.argv[1]} {lower['version']} < {candidate['version']}")
          PY
          sha256sum proof-inputs/*/manifest.json proof-inputs/*/manifest.json.sig > proof-results/inputs.sha256
          printf 'candidate %s\nprevious %s\nlower %s\n' "$candidate" "$previous" "$lower" > proof-results/inputs.txt
          cat proof-results/inputs.sha256 >> proof-results/inputs.txt
          cat proof-results/inputs.txt
          { echo '### Linux update proof'; echo '```'; cat proof-results/inputs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the verifier with this checkout's production keyring
        run: go build -o "$RUNNER_TEMP/manifest-sign" ./cmd/manifest-sign

      - name: Prove the previous nightly updates itself to this one
        run: |
          set -euo pipefail
          # One session bus for AT-SPI and GDK; xvfb-run allocates the display.
          # The harness creates its own HOME and XDG directories under --work
          # and never touches the runner's profile.
          dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/update-proof/prove-linux.py \
            --previous-manifest proof-inputs/previous/manifest.json \
            --previous-signature proof-inputs/previous/manifest.json.sig \
            --candidate-manifest proof-inputs/candidate/manifest.json \
            --candidate-signature proof-inputs/candidate/manifest.json.sig \
            --lower-manifest proof-inputs/lower/manifest.json \
            --lower-signature proof-inputs/lower/manifest.json.sig \
            --verifier "$RUNNER_TEMP/manifest-sign" \
            --work "$RUNNER_TEMP/nocx-nightly-proof" \
            --appimage "$RUNNER_TEMP/nocx-nightly-proof/nocx.AppImage" \
            --evidence proof-results/linux.json

      # Keep the application's own log beside the evidence: when a check fails,
      # the product's stderr is the only account of what it did.
      - name: Keep the application log with the evidence
        if: always()
        run: |
          # A run that never reached the proof still owes a directory: the
          # upload below fails on a missing path, not only on an empty one.
          mkdir -p proof-results
          cp "$RUNNER_TEMP/nocx-nightly-proof/app.log" proof-results/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-update-proof
          path: proof-results/
          if-no-files-found: error
          retention-days: 30
