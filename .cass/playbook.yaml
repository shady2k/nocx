  - id: b-bd-124
    content: "reference (warp mechanism, extracted from ~/.warp/remote-server binary 2026-08-03): Warp does NOT edit remote rc files. It intercepts ssh with a shell FUNCTION defined in the integrated shell (function ssh(){ is_interactive_ssh_session \"$@\" && warp_ssh_helper \"$@\" || command ssh \"$@\"; }), not a regex on typed text. warp_ssh_helper: session id from /dev/urandom LOCALLY (fail-open to plain ssh if unavailable); 'ssh -G' precheck for RemoteCommand (OpenSSH refuses both -> plain ssh); hex-encodes the bootstrap because it has control chars, decodes remotely via xxd or a printf byte loop; private OSC \\e]9278;d;<hex>; optional ControlMaster reuse via ssh -G + ssh -O check. Delivery is by shell STARTUP ARGUMENTS: bash 'exec -a bash bash --rcfile <(echo ...)' (comment: 'so *no* startup files are evaluated'), zsh temp dir + ZDOTDIR + 'unsetopt ZLE; unset RCS; unset GLOBAL_RCS' + exec -l zsh, with WARP_SSH_RCFILES holding the user's original ZDOTDIR. Pasted form where it pastes: ' read -r -d \"\" WARP_BOOTSTRAP_VAR << EOM' + ' eval \"$WARP_BOOTSTRAP_VAR\"' with a LEADING SPACE per line; read -r -d is a bashism so ash/dash is structurally out of reach for them. Uses 'stty raw' (not -echo) around the paste, which also sidesteps MAX_CANON, restored with 'stty sane' before user rcfiles run. Footprint on a warpified host: ~/.warp/remote-server holds 216MB single-file executables, one per version, never pruned (622MB observed). VERIFIED SEPARATELY: 'bash --rcfile <(...)' is a bashism that dies with a syntax error when the parsing shell is dash, and sshd hands a remote command to the user's LOGIN shell -- so process substitution is a local-spawn mechanism, not a remote one. ALSO VERIFIED: busybox ash (alpine) and dash (debian) both re-expand PS1 per prompt with a correct $?, so an OSC 133 A/B/D + OSC 7 'minimal' tier is reachable there (assign PS1 single-quoted, and capture $? before any command substitution)."
    category: reference
    kind: workflow_rule
