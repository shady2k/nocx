  - id: b-bd-044
    content: "herdr worker waves, frontend: sharing one node_modules into worker worktrees by symlink saves the install but fails three separate ways, all of them mimicking real defects. Workers see it as untracked noise in git status and some try to clean it; another session closing a workspace removed the symlink; and a test run then dies with exit 127 'no such file', which reads exactly like a broken suite - I nearly attributed 5 phantom failures to a refactor because of it. AGENTS.md already records the containerized version of this (nocx-x6z3, named volumes with no worktree in the name). Either install per worktree or do not run frontend workers in parallel; if you do symlink, re-verify the link exists in the same command that runs the suite."
