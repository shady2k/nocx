  - id: b-bd-018
    content: "bd refuses two dependency edges between the same pair: 'bd dep add A B' errors if A->B already exists as discovered-from, and you must 'bd dep remove A B' first. This matters because discovered-from does NOT block — a bead with discovered-from an OPEN bead still shows in bd ready (verified 2026-07-26: nocx-hhj3 was ready while its discovered-from source nocx-ckoy.1 was open). So provenance and ordering are mutually exclusive on one pair: if you need the ordering guard, you lose the provenance edge and must record the origin in the description text instead."
    category: general
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
