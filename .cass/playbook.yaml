    content: "nocx, 2026-08-13: 'two owners of one value' is this repo's most recurrent defect — 5 of 11 in one session. Shapes seen: two collections rendering one port (Detected+Forwarded); an input painting a fallback the validator cannot see (value={fv('port') || 22} vs the raw draft); a label reading the inventory while the binding lived on the draft; a mint binding the draft while the save wrote the profile; a stale failed forward beside a live one for the same destination. frontend/lint-fixtures/check-two-owners.mjs now catches the JSX-fallback shape only — the others are still review-only. When a bug report says 'the UI shows X but it behaves like Y', look for the second derivation FIRST."
