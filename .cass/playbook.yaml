  - id: b-bd-076
    content: "lesson (nocx, root cause, 2026-08-25, nocx-1druc): when ONE durable row is opened by one call and closed by another, the field the CLOSE validates but never writes is the one that rots silently. nocx-kpqr3 moved a command's ledger row to open at lifecycle.submitAttempt under the attempt id; that handler hard-coded Source: SourceUser, and RecordCompleted's attempt branch UPDATEs phase/status/times/payload and deliberately not source. So history.record went on accepting, validating and documenting a 'source' the renderer minted ('carried verbatim onto the entry's source column') that no write ever consumed — every command the assistant ran was stored as the person's, and the restore badge, painted from that column, forgot it. Two tells to look for next time: a validated wire field with no reachable write, and a comment claiming an invariant a second writer contradicts. The fix belongs at the OPEN (the fact is minted at submit), not at the close — a close that rewrote it would still leave a RUNNING agent command misattributed for its whole life, which is exactly when a live reader asks. Found only by an e2e that watched a person restart the app; every unit around it was green."
