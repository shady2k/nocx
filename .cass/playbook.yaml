  - id: b-bd-063
    content: "lesson (nocx e2e, cost ~20 min on 2026-07-28): editing a spec file while a Playwright run is in flight produces a failure that is not real — the worker loads the edited source but reports it against the old line numbers, so the caret points at a comment and the error looks like a live defect. theme-switch was diagnosed as a genuine failure this way and passed immediately when run alone. Never edit specs during a suite run; if a single spec fails in a full run and passes alone, suspect this before the product."
