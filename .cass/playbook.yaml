    content: "constraint (nocx, secrets): zalando/go-keyring v0.2.8 exposes exactly Set, Get, Delete and DeleteAll — there is NO enumeration operation on any platform. Consequence: an orphaned entry in the OS store whose journal record was lost cannot be discovered at all, so a 'sweep the keychain for orphans' design is unimplementable through this dependency. It needs a maintained index, or platform-specific enumeration (SecItemCopyMatching / Secret Service SearchItems) outside go-keyring. Found while designing the vault (nocx-nfvd); nocx-dm0 has been amended with the three retarget options."
