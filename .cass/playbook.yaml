  - id: b-bd-031
    content: "e2e on a headless Linux/NixOS box: DO NOT reach for Xvfb + 'wails dev'. That path needs GTK and a working EGL (/run/opengl-driver, hardware.graphics.enable), and without EGL the WebKitWebProcess aborts with EGL_BAD_PARAMETER seconds into the first test, taking :34115 down and leaving every later test on ERR_CONNECTION_REFUSED. The repo already has a headless path that needs none of it: cmd/devharness (app.New()+Start, prints WSPORT) + 'npx vite', then Playwright with NOCX_WS_PORT set — e2e/harness.ts injects window.go.main.WailsApp.GetWSPort from that env var and is a documented no-op under real wails dev. Verified present 2026-07-25.\n\nUse Xvfb + wails dev ONLY when the thing under test is the real webview or the Wails bindings themselves; then EGL is a hard requirement and xvfb-run (not a hand-started Xvfb) is what works, because xvfb-run also writes the Xauthority cookie — without it GTK fails with 'failed to init GTK', which reads like a missing display and is not.\n\nMeta-lesson: this memory's predecessor already existed and was never recalled. bd memories are pull-based. Run 'bd memories <keyword>' BEFORE any environment fight."
