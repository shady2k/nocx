  - id: b-bd-078
    content: "lesson (nocx worker briefs, 2026-08-15): name the EXACT gate the pre-commit hook runs, not a near neighbour. Three worker round-trips were spent on gates I had not named: the hook runs golangci-lint (catches govet shadow, which plain 'go vet' does not), gofumpt -l, and prettier --check . at the repository root. And 'npm run contracts:check' does NOT exist at the root — the script lives only in frontend/package.json, and the hook runs it as 'cd frontend && npm run contracts:check'. A worker held to a literal command either escalates on a phantom blocker or quietly decides the gate was optional; here they honestly reported 'all gates green' and still failed the hook, because they ran exactly what the brief said."
