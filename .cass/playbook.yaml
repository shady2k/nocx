  - id: b-bd-019
    content: "Beads propagates a blocked parent down to its children: a child with no blocks-edge of its own still disappears from 'bd ready' when its parent epic is blocked. Verified 2026-07-26 — nocx-d3q.1..4 have zero dependencies and were absent from a full 'bd ready -n 200', solely because nocx-d3q was blocked on nocx-8v51 and nocx-v1pr. This is what makes 'we are not working on that track right now' a single edge (bd dep add <parked-epic> <active-epic>) instead of a wrapper script or a mass re-prioritisation. It is how the 68-issue ready list was cut to 7 (nocx-k0xk.1).\n\nTwo traps found the same day. (1) 'blocked' is COMPUTED, never stored: bd query 'status=blocked' returns nothing while bd stats counts 23 — you cannot set it, only add the edge that causes it. (2) 'bd swarm validate' counts CLOSED children in its waves, so it reported max parallelism 7 for nocx-6ek whose real ready front was 3 — useless as a gate. The real check is: bd ready --parent <epic> --exclude-type epic -n 100 --json | jq length"
