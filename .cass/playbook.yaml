    content: "lesson (Orca worker waves): a worker will write into the COORDINATOR's checkout unless the brief contains the worktree's ABSOLUTE PATH in its own text. Measured 2026-07-29 on nocx: the brief said 'work only in your worktree (absolute path in the dispatch)' and forbade /home/dev/repos/nocx by name; the omp worker still created every new file there and its own worktree came back empty from git status. Put the literal path in the brief body and require 'pwd' output in the first heartbeat. Nothing errors — the worker reports success honestly because from its side every write succeeded."
