[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "nocx-agent-runtime"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "pydantic-deep==0.3.50",
    "pydantic-ai-harness==0.52.0",
    "pydantic-ai-slim[openai]==2.52.0+nocx.1",
    "openai==3.19.0",
    "httpx2==2.12.0",
]

[tool.uv.sources]
pydantic-ai-slim = { path = "../third_party/pydantic-ai/dist/pydantic_ai_slim-2.52.0+nocx.1-py3-none-any.whl" }

[tool.uv]
required-version = "==0.13.0"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
build-constraint-dependencies = [
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["nocx_agent_runtime"]
