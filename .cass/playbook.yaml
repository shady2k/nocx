  - id: b-bd-049
    content: "Порядок ветвей в internal/assistant/kernel.go invokeClassified — прочитан целиком двумя сессиями 2026-08-30 после слияния двух независимых волн, и он НЕ случайный. Ранние возвраты (floorRefusal по инвокации и ресурсам, floor по сырой строке команды для инструмента с CommandArg, и RefusedFileChanged по версиям одобренных файлов) стоят ДО того, как попытка записана: им нечего закрывать, потому что execID ещё нет. Ветка «человек остановил команду» стоит ПОСЛЕ egress-гейта НАМЕРЕННО: у остановленной команды тоже есть частичный вывод, и он обязан пройти egress так же, как вывод успешной. Она возвращается сама, поэтому обычный TermCompleted ниже до неё не доходит и двойного закрытия попытки нет ни на одном пути. Если кто-то будет двигать stop выше по функции ради читаемости, потеряется именно прохождение частичного вывода через egress — а git при этом покажет чистое перемещение блока и промолчит."
