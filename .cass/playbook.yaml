  - id: b-bd-060
    content: "lesson (nocx CI): ci.yml skips draft pull requests on purpose (the job guard is 'github.event_name != pull_request || !github.event.pull_request.draft', ci.yml:105, and the pull_request trigger lists ready_for_review). So a draft PR shows every check as 'skipping' and gives no signal at all. To gate a branch without taking the PR out of draft, dispatch the same workflow by hand: gh workflow run ci.yml --ref <branch>. It runs the identical jobs on the identical commit."
