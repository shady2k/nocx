  - id: b-bd-061
    content: "lesson (nocx, diagnosing a red e2e suite — cost ~an hour on 2026-07-28): a failure COUNT tells you nothing about WHAT is broken. '60 of 60 failed' meant three different things in a row during the kit migration, and none was a code regression. (1) Two vite instances on 5173; the first held the port and its HMR had stopped, so Playwright was measuring code from before the last two commits. (2) 'No tests found' was my own command being wrong: playwright.config has testDir './e2e', so a path filter is relative to THAT — 'npx playwright test proof-matrix', never 'npx playwright test e2e/proof-matrix.spec.ts'. I nearly concluded the spec file was corrupt. (3) The real one: cmd/devharness had logged 'application stopped' 40 minutes earlier while the PROCESS still held port 9876 — ss showed LISTEN, curl returned 200, and every WS session failed, so all tests died in beforeEach on a missing terminal. What distinguished them: running ONE test with full output instead of reading the summary, then reading the BACKEND log. Order to check: (a) is the stand's backend log still serving, not just listening; (b) is exactly one dev server on the port and is its HMR current; (c) run one case verbatim and read the locator that failed; only then (d) suspect the code. Also: after a migration renames classes, a red test often means the TEST names a retired class — .tab-add died with nocx-wqrq — so prefer accessible names over classes in e2e selectors."
    category: workflow
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
