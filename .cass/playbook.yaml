  - id: b-bd-032
    content: "environment (nocx, linux): the primary dev machine has no Secret Service — nothing owns org.freedesktop.secrets on the session bus and no gnome-keyring/kwalletd is running. zalando/go-keyring's linux backend (keyring_unix.go) needs it, so every credential Set/Get fails there, and keyring_fallback.go only returns ErrUnsupportedPlatform. This is not dev-only: release.yml:179-288 ships a linux/amd64 AppImage. Verified 2026-07-30 with 'busctl --user list | grep secret' and pgrep. Any secret-storage work must assume the keychain can be absent on a shipped platform; that fact is what forced the encrypted-file provider in the vault design (nocx-nfvd)."
