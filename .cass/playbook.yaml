  - id: b-bd-118
    content: "recipe (nocx e2e, headless, verified 2026-07-27): a bare 'npx playwright test' goes through the webServer stanza and therefore 'wails dev', which needs GTK/webkit2gtk and dies on a headless box after a 240s timeout. Set NOCX_WS_PORT and the config skips webServer entirely — then the CALLER owns both processes. Working sequence, used to run the 60-case proof matrix: (1) NOCX_WS_ADDR=127.0.0.1:9876 go run ./cmd/devharness, which prints WSPORT and WSTOKEN; (2) cd frontend && NOCX_WS_PORT=9876 NOCX_WS_TOKEN=<token> npx vite --port 5173; (3) from the repo root, NOCX_WS_PORT=9876 NOCX_WS_TOKEN=<token> npx playwright test <spec>. Both ports must be loopback — the WS auth rejects a non-loopback origin. For parallel workers, give each its own pair of ports or the second silently tests the first one's build."
