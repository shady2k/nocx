  - id: b-bd-144
    content: "xterm.js 5.5.0 / addon-webgl 0.18.0: a TextureAtlas page merge mutates cached glyph texture coords in place and only sets _requestClearModel, which WebglRenderer reads at the TOP of a frame. The merge happens later in that same frame inside _updateModel, so the frame draws stale coords and nothing schedules a follow-up frame — the corruption persists until some other event renders. Linux masks it via nocx's isLinuxWebKit FORCED_REFRESH_MS pump; macOS has no pump. Also: CharAtlasCache is one module-global cache, so every nocx tab with the same font/theme/DPR SHARES one atlas — a merge caused by tab B moves coords under tab A. Conversely, DPR change and WebGL context loss are already fully handled by xterm itself (RenderService.handleDevicePixelRatioChange -> refreshRows, setRenderer -> _fullRefresh) — do not file those as nocx gaps. See nocx-4z5hv."
