    content: "lesson (nocx frontend): the repo has TWO tsconfigs and vitest type-checks neither. tsconfig.json covers src, tsconfig.test.json covers the tests, and 'npm run typecheck' from frontend/ runs both -- which is what the pre-commit hook runs. A worker told to run 'tsc --noEmit -p tsconfig.json' can be green in vitest AND green under that command while a test fixture is missing a newly required field, and only the commit gate catches it. Measured 2026-08-23: adding run/runDropped to the Occurrence contract left two fixtures red in tsconfig.test.json alone. Always name 'npm run typecheck' in a brief, never a single -p."
