    content: "nocx headless e2e, corrected 2026-08-29: cmd/devharness NO LONGER EXISTS — it was deleted by nocx-gpyxp because it was a 51-line duplicate of the shipped coordinator. The headless backend is now cmd/nocx-server, the SAME binary production spawns, so the suite exercises what ships. NOCX_WS_PORT is dead too: e2e/preflight.ts REFUSES a run with it set, because nothing reads it any more and a run that thinks it drives its own backend is measuring the wrong process. There is one stand, Playwright owns it (e2e/stand.ts), and e2e/home-isolation.ts applies the disposable HOME to every backend the suite starts and RAISES rather than warns if a caller opts out. Any older memory naming devharness or the NOCX_WS_PORT shim is stale — read AGENTS.md's e2e section instead."
