  - id: b-bd-089
    content: "nocx CI, 2026-08-30 (PR #139): a red `npm run lint` reports ONE failure while several exist, because the script is an && chain — eslint && check-css-colors && check-css-integrity && check-dead-exports && check-two-owners && check-row-grammar && check-error-vocabulary && check-menu-icons. check-css-integrity failed on an undefined var, so check-dead-exports NEVER RAN and CI never saw its 2 new violations (ReconnectOffer, documentWakeSource). Fixing only what CI printed would have put the merged tree red on ci-frontend a SECOND time. So: after fixing any check-* failure, run the WHOLE chain locally before pushing — the first failure masks every later one, and the ratchets are ordered cheapest-first, which is exactly the order that hides the expensive ones. Related: an undefined CSS var with no fallback is not cosmetic — the declaration is invalid at computed-value time, so ConnectionIndicator shipped with no background at all, not a wrong shade. Also confirmed this session: CI does NOT run on pushes to main (only the pages workflow, and only on site/ changes), so the merged-tree gate before the merge is the ONLY gate that tree ever gets."
