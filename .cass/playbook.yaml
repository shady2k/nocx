  - id: b-bd-096
    content: "nocx/herdr worker waves, 2026-08-23: verify the INDEX before every commit, not just the working tree. A git stash push/pop cycle (used to baseline a suspected flake) restores tracked modifications UNSTAGED while new files stay staged, so a commit without a second 'git add' ships exactly half a change — the new files without their call site. The build passed, the tests passed, the pre-commit hook passed, because all three are consistent with what was staged. Habit: 'git diff --cached --name-only' and eyeball the count against what the worker changed, every time. Same run, second habit bought the same way: check 'git log <worker-base>..HEAD -- <paths>' BEFORE copying files out of a worker worktree, or you silently revert your own commit."
