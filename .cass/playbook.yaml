  - id: b-bd-013
    content: "A worker's completion sentinel matches itself twice over, and putting it in a brief FILE is not enough. The herdr skill warns that a sentinel quoted in the text you paste into a pane matches instantly — so the defence is to put it in a file and send a one-line pointer. That defends against the ECHO OF YOUR OWN INPUT and nothing else. Measured on nocx-dc2fr.7, two false wakes in a row: first the agent's internal advisor quoted the brief back on screen ('terminate with `WORKER_BLOCKED::<id> ...` as BRIEF-3 requires'), then the agent READ the brief file and its template line 'WORKER_BLOCKED::<id> <one line why>' landed in the pane. The pane snapshot contains everything on screen, including anything the worker reads or reasons about, and a worker reads its own brief by design. Anchoring to line start (^ *WORKER_) does not help — both false lines are at line start. What works: stop matching the sentinel for that worker and watch --status idle/done/blocked instead, then read the pane and judge; or require a form only the finished output has, never the template's own placeholder. Cheapest reliable signal remains the worktree: git status and the test artifacts say what happened without any string matching at all."
    category: general
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
    source: learned
    tags:
