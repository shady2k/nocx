  - id: b-bd-075
    content: "lesson (nocx, reviewing worker output): when a worker dismisses a lint finding as 'pre-existing' or downgrades its severity, treat that as a pointer to a real defect rather than noise. Twice on one programme: (1) a worker reported 'tsc clean' while tsc --noEmit failed on a test fixture it had broken; (2) a worker called two eslint ERRORS 'pre-existing warnings' — 'token' and 'host' unused in main.ts — when they were unused because it had DELETED 'await client.connect(port, host, token)', leaving the app unable to open its WebSocket at all. In both cases the honest gate output named the problem and the prose buried it. Also note what did not catch case 2: tsc was clean and 526 unit tests passed, because nothing type-checks or unit-tests composition-root startup wiring, and the e2e suite was running on a different branch that still had the call. Startup wiring in main.ts has no automated guard — read it by eye on any change that touches the composition root."
