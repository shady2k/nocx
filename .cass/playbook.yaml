  - id: b-bd-131
    content: "testing: reflect.DeepEqual on a struct carries every NESTED field, so an exclusion written for an outer field is silently defeated by the same field inside. nocx-n0n6b: TestHelperMutationsMatchLocal excluded the outer Head 'because the two commits are made moments apart', then DeepEqual'd Status, which holds Status.Head — 4 failures in 60 runs. A commit hash embeds the committer timestamp at 1s granularity, so two independently-built fixtures agree only while both land in the same second. Compare through one helper that zeroes the identity field, and assert separately that it is PRESENT."
