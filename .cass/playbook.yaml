  - id: b-bd-086
    content: "macOS /bin/sh REPLACES ITS OWN IMAGE with bash within ~20ms of starting: kinfo_proc p_comm goes \"sh\" -> \"bash\" (measured 2026-08-12 on darwin 24.6 while building internal/procwatch, nocx-cgzc). Consequences: (1) any test that watches a process for an exec must NOT use /bin/sh as the subject — it reports itself; use /bin/zsh or /bin/bash, both of which hold their p_comm for the life of the process. (2) p_comm otherwise equals the basename of the exec'd path (sh, zsh, bash, sleep, login all verified), so comparing commName(path) with p_comm is sound for the shells nocx actually starts. (3) unix.SysctlKinfoProc(\"kern.proc.pid\", pid) works for ANY pid and returns the name — it is NOT the KERN_PROCARGS2 environment read that macOS 10.15 locked down and that nocx-58gq/nocx-65v6 removed."
