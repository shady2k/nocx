  - id: b-bd-126
    content: "rule (nocx, coordinating worker waves — learned the expensive way 2026-07-27): a worker's report and a worker's WORKTREE are both untrustworthy as evidence of delivery; only the COMMIT counts. Two failures in one wave: the component-kit worker reported 'full gate green, 593 tests' with every file untracked, and the composition-root worker's round-2 revision was reviewed by grepping its working tree, accepted, merged — and the merged commit contained round 1 only, because the revision was never committed. The worktree was then deleted and the work was unrecoverable. Procedure: (1) review with git show <sha> or git diff <base>..HEAD, never by reading files in the worker's checkout; (2) before removing any worktree, require 'git status --short' to be EMPTY and the branch head to contain the reviewed change; (3) treat a worker_done that does not name a commit sha as 'not delivered' and ask for one. Cost of skipping: silently shipping the pre-revision version of a change you believe you reviewed."
    category: workflow
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
