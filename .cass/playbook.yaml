  - id: b-bd-110
    content: "orca CLI on this VM is a shim, not a binary: /home/dev/.orca-relay/bin/orca proxies to the relay over a unix socket whose path is tied to ONE relay run. The bin dir is injected into PATH by the relay at agent-session start — it is in no rc file (~/.bashrc, ~/.profile, ~/.bash_profile, /etc/profile all lack it). Consequences: (1) inside an agent session orca resolves fine, so 'not found' is not the usual failure; (2) NEVER call orca from a script, nohup/background job, cron or a fresh SSH login — PATH will not have it and the socket belongs to a different run, so it fails with 'Orca SSH CLI bridge cannot find the relay socket'. A background wrapper that calls orca therefore reports a dead worker when the real fault is the invocation.\n\nWhen orca commands hang instead (terminal list taking minutes, task-create timing out past 6 min, task-list past 45s), that is the runtime being wedged or the box under load — not PATH. Seen right after a runtime restart and during an OOM episode; it recovered once idle worker sessions were closed."
    category: general
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
    source: learned
