  - id: b-bd-102
    content: "Nocx signal/transport container failures: ONE run against ONE run is not evidence, and I have now mis-attributed the same test twice on it. 2026-08-26, TestSessionSignal_InterruptReachesTheRunningCommand (nocx-sf4kx): I wrote a worker brief asserting 'it is this change, it is not a flake' from clean-passes-once vs change-fails-once, and biased the worker with it; the worker refused to touch production code without causal proof and was right. Alternating 4 clean / 4 staged runs of the SAME command shape then failed on the CLEAN tree at loadavg 15. Protocol before blaming a branch for a container failure: alternate arms A/B/A/B, at least 3 each, same command shape, and record loadavg per run — the confound is machine load, and load comes from OTHER agents' gates running concurrently on this box."
