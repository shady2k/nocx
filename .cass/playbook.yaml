  - id: b-bd-001
    content: "2026-08-14: pre-commit starts two docker containers (go test -race + vitest) in parallel; with 6 omp agents across 4 nocx worktrees on a 6-core box, one commit's hook ran 16899s wall (4.7h) before the caller's timeout killed it. Docker was empty afterwards, and the same hook is minutes when run alone. Orchestrator rule that follows: serialize commits across your own workers - one worker commits at a time, and run the commit detached (nohup git commit -F msg > log 2>&1 &) then poll the log, because a tool timeout kills the hook mid-container and you lose the whole run. Related: nocx-x6z3 (shared named node_modules volume)."
