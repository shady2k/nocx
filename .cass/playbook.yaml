  - id: b-bd-009
    content: "A program path prefix defeats a program-name match. Any parse that switches on words[0] must normalise with filepath.Base FIRST — content/floor.go forbiddenInvocation does, and assistant/cmdeffect.go's disqualifier did not, so 'bash -c' was disqualified with 2 unresolved while '/bin/bash -c' came back disqualified=false with ZERO unresolved. That does not violate the Disqualified=>Unresolved invariant, it makes it vacuous: the flag is false when it should be true, so the guard never fires and the effect derivation trusts a nested command string nothing ever read. Found on nocx-4h0m7.3 by probing the parse, not by reading it. Two normalisation rules for one concept is the defect; extend the existing one."
