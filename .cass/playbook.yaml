  - id: b-bd-037
    content: "gh pr merge --auto MERGES IMMEDIATELY on nocx, it does not wait for checks. The repository does not have GitHub auto-merge enabled, and gh silently falls back to a normal merge instead of erroring — no warning, no non-zero exit, and afterwards autoMergeRequest is null while mergedAt is set. Cost on 2026-09-02: PR #172 went into main with four jobs (both ci-backend, both ci-e2e) still pending. To merge only on green, watch the checks yourself and run 'gh pr merge <n> --merge' after they all pass; verify intent afterwards with 'gh pr view <n> --json state,mergedAt,autoMergeRequest' — an armed auto-merge shows a non-null autoMergeRequest and a null mergedAt, and anything else means it already merged."
