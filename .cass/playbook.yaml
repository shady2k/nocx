  - id: b-bd-138
    content: "Two omp workers sharing ONE git worktree cannot commit independently, and the reason is not the index. The pre-commit hook runs golangci-lint ./... and gofumpt over the WORKING TREE, so any worker sitting in a TDD red phase fails every other worker's commit — even a commit that touches no Go at all. Measured 2026-08-14: a frontend-only commit (snippets client) died on 'FAIL: golangci-lint' pointing at internal/backup/service_test.go, another worker's half-written task-4 test (unused time import, NewService called with 4 args against a 3-arg signature). Consequences for an orchestrator: parallel WRITING is safe and worth it, parallel COMMITTING is not; serialize commits with a lockfile AND require the tree to be clean of the other worker's changes, not merely unlocked. TDD makes this structural rather than occasional, because red is a required state. The real fix is a worktree per worker, which git forbids on one shared branch — so it needs a branch per worker plus merges. Related: nocx-x6z3, nocx-kw0m."
    category: general
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
