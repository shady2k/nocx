  - id: b-bd-016
    content: "bd backup status reports 'Database size: 0 B' and 'dolt.configured: false' in this repo, and that is CORRECT — do not investigate it again. Decided 2026-07-26 by the owner: no independent backup destination, the local copy is enough.\n\nWHY 0 B: the backup: block in .beads/config.yaml is entirely commented out, so no destination was ever registered with 'bd backup init <path>'. database_size measures that unregistered Dolt destination, not the local files. Auto-backup still runs and works — .beads/backup/ held 129 files, 27M, with a .darc, manifest and backup_state.json written minutes earlier, on a 15m interval.\n\nWHERE THE TASKS ACTUALLY LIVE, since this confused the owner and will confuse the next reader:\n- refs/dolt/data on github.com/shady2k/nocx — the full Dolt DB with history, written by the pre-push hook, and what 'bd bootstrap' reads on a fresh clone. Invisible in the GitHub web UI because it is neither a branch nor a tag, which is exactly why people assume the backlog is not on GitHub. It is.\n- .beads/issues.jsonl on main — a lossy export: issues without history, audit trail or kv memories. bd bootstrap lists it fourth in its fallback chain, after sync.remote, refs/dolt/data and .beads/backup/*.jsonl.\n- .beads/embeddeddolt/ (57M) and .beads/backup/ (27M) are gitignored and never leave the machine.\n\nSo there are two copies on GitHub and one local. What is deliberately absent is a copy independent of GitHub, which would matter only if refs/dolt/data were itself corrupted or stranded — the risk AGENTS.md warns about for concurrent pushes to a git-protocol Dolt remote. Accepted: one person pushes, agents work in worktrees on the same machine.\n\nRelated, already documented in .beads/config.yaml lines 51-53 rather than anywhere else: why issues.jsonl is tracked and auto-exported at all — it is what a reader sees on GitHub and the last-resort bootstrap source, and hand-exporting is how it drifts. Do not gitignore it; pre-commit step 8 stages it and would fight you."
    category: general
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
    source: learned
