    content: "Two workers in ONE worktree cannot commit independently, even with disjoint file sets. .githooks/pre-commit runs golangci-lint over the WORKING TREE, not the index, so a staged frontend-only commit fails on another worker's half-written Go file (measured 2026-09-03: nocx-swn1m's two .tsx files blocked by nocx-qja4m.5 mid-edit in internal/skill/preview.go, referencing struct fields it had not yet added to write.go). Consequences for a coordinator: disjoint file sets are necessary and NOT sufficient; either give each worker its own worktree, or serialise the commit points — collect both reports, then commit in sequence once the tree is consistent again. Do not reach for --no-verify: the hook is the gate, and the failure is real information about the tree you are about to commit from."
