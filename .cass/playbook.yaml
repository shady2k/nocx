    content: "nocx notifications, 2026-08-23: a settings CATALOGUE that declares routable kinds is a read path, and it hid three write paths that did not exist. internal/notify/catalogue.go offered five kinds with labels and channel toggles; only program.notify and session.ended were ever raised. deadcode cannot see it (every symbol is genuinely reachable), unit tests cannot see it (they call the raiser directly), and a diff review cannot see it (the backend half looks complete). block.finished was then wired TWICE and did not work either time: once because a git stash pop left the call site unstaged and Go does not error on an unused unexported func, once because the raise sat on ledger.close and the renderer only ever calls history.record. Both were caught only by an e2e that ran a command and opened the panel. Rule: when wiring a source, grep the RENDERER for the method name before choosing the seam, and write the end-to-end spec FIRST so it leads the work instead of confirming it."
