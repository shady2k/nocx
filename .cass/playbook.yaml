  - id: b-bd-069
    content: "lesson (nocx input editor): do NOT hand-roll bracketed-paste wrappers (ESC[200~..ESC[201~) when submitting the DOM editor's command. Route through the terminal engine's term.paste(text) which wraps ONLY when the shell enabled mode 2004. Hardcoded wrappers leaked as literal …00~/…01~ into the command when 2004 wasn't (yet) enabled — e.g. a fast second submit racing the prompt. Also: Ctrl-C in the editor must clear + send \\x03, else stale text corrupts the next command. Root-caused via CI Playwright traces (nocx-4ff)."
