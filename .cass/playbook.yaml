  - id: b-bd-064
    content: "lesson (nocx e2e, root cause): the disk exhaustion that took the host down was NOT caused by concurrent Playwright runs — I diagnosed that wrongly. It was crash dumps: WPEWebProcess segfaults on TEARDOWN (heap-metadata corruption in unlink_chunk during __run_exit_handlers) and each dump ran ~5.8 GB, around 42 a day; chromium produced zero. One crash was enough to fill the filesystem. The crash is upstream in a stripped library and unfixable here; it was neutralised by capping core-dump size at the host level. Two consequences for the repo: (1) a WebKit failure reported as 'browser closed unexpectedly' may be this teardown crash rather than a test defect, since assertions have already completed — check whether the process died on exit before chasing it as a product bug; (2) do NOT add blanket Playwright retries to absorb it, because the flake work in nocx-rdkh made waits condition-based on purpose and retries would hide the next real failure. WebKit stays despite being the noisy one: nocx-q18's glyph corruption reproduces in WKWebView and not Chromium."
    category: workflow
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
    source: learned
    tags:
