  - id: b-bd-072
    content: "lesson (nocx, measured 2026-08-01, cost: a developer's theme reset on every e2e run and 22 of 25 specs writing their real profile): a guard that somebody has to REMEMBER to apply is not a guard. The e2e XDG isolation existed in e2e/harness.ts and was correct — it had been applied to 3 specs out of 25, and every new spec silently opted out. Adding a second opt-in mechanism (a --test-mode flag, an env var, an in-memory store selected at runtime) buys nothing, because forgetting it lands on the production path exactly as before. Make the DEFAULT safe instead: nocx now picks its profile directory by build tag, nocx-dev unless -tags release, so there is nothing to pass and nothing to forget, and the tag is on the release side so a forgotten flag costs a developer an empty profile rather than a user their data. termic does the same (APP_DIR = cfg!(debug_assertions) ? termic_dev : termic, env override dead in release); orca adds the two layers worth stealing next — a test that ASSERTS the isolation holds, and a tripwire watching the real home for writes. Corollary that hid this for months: a CI runner's $HOME is fresh and disposable, so any 'the tests scribble on the real profile' defect is invisible in CI by construction — green forever. When a test touches user state, ask where that state lives on a DEVELOPER's machine, never on the runner's."
