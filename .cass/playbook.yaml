  - id: b-bd-099
    content: "Длинные гейты в nocx (make ci-full, scripts/ci-*.sh, e2e/run-in-container.sh) нельзя запускать фоновой задачей харнесса: когда задача завершается, харнесс убивает группу процессов вместе с docker-контейнером, и джоба умирает молча, оставив две строки лога и код вроде 146. Читать при этом код возврата пайплайна (например через | tail) тоже нельзя — он вернёт 0 от tail. Правильный способ: herdr pane split, herdr pane run в этом пейне, и ожидание по ФАЙЛУ-маркеру, который пишет сама команда. НЕ по herdr pane wait-output --match: он матчит эхо твоей же команды в снимке пейна и срабатывает мгновенно. Отдельно: scripts/ci-frontend.sh делает npm ci вживую на каждом прогоне (кэша npm у него нет, в отличие от e2e-раннера после 449ed02d), поэтому он падает на ETIMEDOUT при плохой сети — это не диск и не память. И он заканчивается на exec docker run, из-за чего trap gate_lock_release не срабатывает и /tmp/nocx-hook-gate-$(id -u).lock залипает."
