  - id: b-bd-005
    content: "A brief is where architecture is decided, so AGENTS.md's five pre-fix checks gate the BRIEF, not the diff. 'I am not touching code' is the moment the exemption costs most: the worker implements what the brief says, and by then the checks can only confirm the decision. A brief crossing a boundary must name the ADs/ADRs it touches and what they already decided BEFORE it says what to build. Bought 2026-08-04 by three misses in one session — a spec proposing all three techniques ADR-0004 rejects; a brief telling a worker to shell out locally against Interface-first+DI and against internal/contentkey's existing per-OS pattern; and a claim that nocx never deploys a remote binary while architecture.md defers Tier-B, AD-2 names it a build target and nocx-if6 phase B IS that relay."
