  - id: b-bd-021
    content: "Brief-writing instrument, bought twice in one wave (epic nocx-0c7qz): WHEN A BRIEF REMOVES OR RENAMES A SYMBOL, THE BRIEF STATES THE CALL-SITE COUNT AND HOW IT WAS COUNTED. Estimating is the wrong skill -- the count is mechanical and takes two seconds: grep -rn 'Symbol(' --include=*.ts --include=*.tsx <dir> | wc -l. I predicted 2 call sites for removing Dispatcher.connect; it was 106 across 27 files, because WSClient.connect was a SECOND public layer over it and is what every test actually called. The failure is not the wrong number, it is that the worker discovers mid-flight that NO COMMIT CAN PASS THE HOOK: pre-commit type-checks the whole frontend, so 'my files green, others red' is not a committable state. Same wave, same shape, second instance: splitting a JSON-RPC contract from its only consumer leaves the generated type dead on arrival and the dead-export ratchet fails the commit, with no deferral available (that baseline may only SHRINK and its updater refuses to write one that grows). General rule: a contract lands with its consumer, a package with its caller, an API change with its call sites. If a task's output has no consumer inside the task, the task boundary is wrong -- check it against the ratchets BEFORE dispatching. This is nocx-z7s6 restated for a coordinator: the gate is the hook, not the brief, and a worker cannot be briefed out of it. Instrument credited to the peer session fix-assistant-fullscreen-f7."
