  - id: b-bd-104
    content: "nocx/vault: a RELIABLE recipe for a locked Secret Service. Do not kill the daemon (pkill -f gnome-keyring-daemon kills the dbus-run-session shell too, exit 144). Instead lock the collection over D-Bus and read state WITHOUT writing: nix-shell -p gnome-keyring dbus --run 'dbus-run-session -- bash -c \"eval $(echo -n pw | gnome-keyring-daemon --daemonize --login); echo -n pw | gnome-keyring-daemon --unlock; dbus-send --session --dest=org.freedesktop.secrets --print-reply --type=method_call /org/freedesktop/secrets org.freedesktop.Secret.Service.Lock array:objpath:/org/freedesktop/secrets/collection/login\"'. The earlier 'unreliable repro' note was about ORDER: any go-keyring write calls Unlock first, and a --login daemon holds the password and self-unlocks, so the lock looks like it never happened. Read the Collection.Locked property before writing and the locked state is stable. Verified 2026-07-30 on nocx-25k9.6."
