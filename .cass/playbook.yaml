  - id: b-bd-004
    content: "A bead's premise is a report, not a fact — check the situation before building the fix. Twice in one week on nocx: the markdown bead said an answer rendered as source (it was inside a fenced block; the renderer was right), and nocx-4ff.37 said a long command shows no waiting indicator (it was mounted immediately and CLIPPED by a zero-row measurement that sized the live region to padding with overflow hidden). Both times a worker's first instinct was to BUILD the missing thing — a table renderer, a 400ms delay — and both times that would have shipped a second mechanism beside a working one, in the delay case making the reported symptom strictly worse. Put 'first establish what the situation actually is, and report it before editing' as the FIRST acceptance criterion of every bead written from a user report."
