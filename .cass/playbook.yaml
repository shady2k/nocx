  - id: b-bd-014
    content: "Adversarial spec review: every round's blockers sat in text written SINCE the previous round, not in text left alone. Round 1 of the distribution spec (nocx-a75) found 7 blockers in the original draft; round 2 found 4 more and all four were inside the FIXES from round 1; round 3 broke the crash-consistency protocol written between rounds 2 and 3 in five places. Corollary that actually saved the design: when a third round keeps finding the same class of bug (there, 'crash between a filesystem mutation and the journal write describing it'), stop patching instances and delete the concept — replacing the phase machine with 'filesystem is the truth, journal records intent, identity by device+inode' removed the whole class instead of the five instances. Practical rule: after fixing review findings, re-review the fixes specifically; and prefer reviewing CODE over prose once code exists, since prose review cannot check what os.Executable() actually returns or whether a constructor awaits what it starts."
