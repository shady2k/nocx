# ADR-0097: stable is a promotion of a tried nightly, never another build.
# No tag trigger, reusable build workflow, compiler, packaging or CI rerun here.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Rehearse promotion/refusals with fixture artifacts and a substituted key; no publishing or secrets'
        required: true
        default: true
        type: boolean
      nightly:
        description: 'Immutable nightly tag you installed and tried (nightly-YYYYMMDD-RUNID)'
        required: false
        type: string
      tried:
        description: 'I installed and tried this exact nightly and approve its promotion'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# One release group with the nightly (ADR-79b6cy61): the promotion tags the
# commit a nightly published, so a nightly must not publish over it mid-run.
concurrency:
  group: nocx-release
  cancel-in-progress: false

jobs:
  dry-run:
    if: inputs.dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Good promotion and mandatory refusals with substituted signing key
        run: node --test --test-reporter=tap scripts/release/promotion*.test.mjs

  authorize:
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a non-owner, untried nightly or non-main dispatch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          TRIED: ${{ inputs.tried }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] && [ "$TRIGGERING_ACTOR" = "$OWNER" ] &&
            [ "$REF" = refs/heads/main ] && [ "$TRIED" = true ] || {
              echo '::error::only the owner on main may promote a named nightly they confirm trying'
              exit 1
            }

  promote:
    needs: authorize
    # Also checked in the script. Check both actors so a rerun cannot bypass it.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main' && inputs.tried && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Never execute tooling from the untrusted candidate tag. Candidate
          # source is read with git show, and payloads are never executed.
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify owner, candidate provenance, PR-head CI and candidate README
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ inputs.nightly }}
          TRIED_NIGHTLY: ${{ inputs.tried }}
        run: node scripts/release/promotion-github.mjs collect promotion

      - name: Copy exact payload bytes and sign only the stable manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/release/promotion-github.mjs prepare promotion

      - name: Upload draft, download and compare digests, then publish stable
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion-github.mjs publish promotion

      - name: Update the stable Homebrew cask from the verified promoted zip
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo '::error::HOMEBREW_TAP_TOKEN is empty; stable is published but its cask is not updated'; exit 1; }
          gh auth setup-git
          gh repo clone shady2k/homebrew-nocx tap
          node scripts/release/promotion-github.mjs cask promotion tap/Casks/nocx.rb
          version="$(node -p "require('./promotion/plan.json').version")"
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C tap diff --quiet -- Casks/nocx.rb; then
            git -C tap add Casks/nocx.rb
            git -C tap commit -m "chore: update nocx cask to v${version}"
            git -C tap push origin HEAD:main
          fi

      # Evidence survives a failed tap push/version PR as well as a success.
      - name: Preserve promotion evidence and exact stable digest plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-promotion-evidence
          path: |
            promotion/evidence.json
            promotion/plan.json
          if-no-files-found: warn
          retention-days: 90

  # nocx-86e2f: the same real-UI proof the nightly runs, on the stable
  # channel — the PREVIOUS stable AppImage (v0.8.0) runs its own updater,
  # selects stable in Settings, and installs the stable release this run just
  # promoted, then is hashed after its own Restart. A separate job, not a
  # step after `promote`, gives it a desktop and its own 45 minutes without
  # holding the promotion job open; `needs: promote` is also what makes it
  # prove only bytes this run published.
  prove-linux-stable:
    needs: promote
    if: needs.promote.result == 'success'
    # The artifact is linux/amd64 and the host must be newer than the 22.04
    # the image was built on — the same host the nightly proof uses.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Reading back the promotion's own plan.json from this run's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The harness, the verifier and the production keyring come from
          # main — the tree the promotion signed with. The promoted tag's
          # tree is never executed here.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/linux-update-proof-runtime

      - uses: actions/download-artifact@v8
        with:
          name: stable-promotion-evidence
          path: promotion

      - name: Refuse to prove anything but the stable this run promoted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p proof-results
          promoted="v$(/usr/bin/python3 -c 'import json; print(json.load(open("promotion/plan.json"))["version"])')"
          echo "PROMOTED_TAG=$promoted" >> "$GITHUB_ENV"
          # Readiness owns the version selection: newest stable, the one below
          # it for the pair, and one below that for the downgrade probe.
          set +e
          /usr/bin/python3 scripts/update-proof/prove-linux.py --publication-status \
            --channel stable --promoted "$promoted" > proof-results/status.json
          status=$?
          set -e
          cat proof-results/status.json
          if [ "$status" -ne 0 ]; then
            reason=$(/usr/bin/python3 -c 'import json; print(json.load(open("proof-results/status.json"))["reason"])' 2>/dev/null || echo "readiness exited $status")
            if [ "$status" -eq 2 ]; then
              echo "::error::publication blocked: $reason — blocked is not a pass"
            else
              echo "::error::$reason"
            fi
            exit 1
          fi

      - name: Stage the promoted stable, the previous stable and a lower stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r candidate previous lower < <(
            /usr/bin/python3 -c 'import json; d=json.load(open("proof-results/status.json")); print(d["candidate"], d["previous"], d["lower"])'
          )
          if [ "$candidate" != "$PROMOTED_TAG" ]; then
            echo "::error::the newest stable is $candidate, but this run promoted $PROMOTED_TAG; refusing to prove another run's artifact"
            exit 1
          fi
          mkdir -p proof-inputs/candidate proof-inputs/previous proof-inputs/lower
          for slot in candidate previous lower; do
            gh release download "${!slot}" \
              --pattern 'manifest.json' --pattern 'manifest.json.sig' \
              --dir "proof-inputs/$slot"
          done
          sha256sum proof-inputs/*/manifest.json proof-inputs/*/manifest.json.sig > proof-results/inputs.sha256
          printf 'candidate %s\nprevious %s\nlower %s\n' "$candidate" "$previous" "$lower" > proof-results/inputs.txt
          cat proof-results/inputs.sha256 >> proof-results/inputs.txt
          cat proof-results/inputs.txt
          { echo '### Linux stable update proof'; echo '```'; cat proof-results/inputs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the verifier with this checkout's production keyring
        run: go build -o "$RUNNER_TEMP/manifest-sign" ./cmd/manifest-sign

      - name: Prove the previous stable updates itself to the promoted stable
        run: |
          set -euo pipefail
          # Same driver and same assertions as the nightly proof; only the
          # channel and the three staged manifests differ.
          dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/update-proof/prove-linux.py \
            --channel stable --promoted "$PROMOTED_TAG" \
            --previous-manifest proof-inputs/previous/manifest.json \
            --previous-signature proof-inputs/previous/manifest.json.sig \
            --candidate-manifest proof-inputs/candidate/manifest.json \
            --candidate-signature proof-inputs/candidate/manifest.json.sig \
            --lower-manifest proof-inputs/lower/manifest.json \
            --lower-signature proof-inputs/lower/manifest.json.sig \
            --verifier "$RUNNER_TEMP/manifest-sign" \
            --work "$RUNNER_TEMP/nocx-stable-proof" \
            --appimage "$RUNNER_TEMP/nocx-stable-proof/nocx.AppImage" \
            --evidence proof-results/linux-stable.json

      - name: Keep the application log with the evidence
        if: always()
        run: |
          mkdir -p proof-results
          cp "$RUNNER_TEMP/nocx-stable-proof/app.log" proof-results/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-stable-update-proof
          path: proof-results/
