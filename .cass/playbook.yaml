  - id: b-bd-047
    content: "herdr worker waves: worker panes and workspaces can be closed by ANOTHER session sharing the same herdr server - four of mine vanished mid-epic while a colleague's session tidied up, and their agents went with them. Git worktrees and branches survived on disk with every commit, so nothing was lost, but the ability to send a red gate back to the worker that wrote it was. Keeping the worktree is NOT enough to keep the worker: verify with herdr agent list in the same turn you rely on one, and plan for resuming a task with a fresh agent in the existing worktree plus a written resume brief."
