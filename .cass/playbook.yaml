  - id: b-bd-027
    content: "deadcode blind spot, third instance and a new shape: a feature can be dead because a STRUCT FIELD is never assigned, not because a symbol is unreferenced. internal/assistant Params.Presentation has no production caller (every 'Presentation:' outside tests is a test), so p.Presentation is nil on every run, the lazy tool projection is never taken, and tools.search is NEVER declared to the model -- epic nocx-0h66x closed with its feature unreachable (nocx-7icvn). deadcode cannot report this in ANY form: it is not an unreferenced symbol, so neither -filter nor -whylive on the symbol reveals it; the dead half hides behind a genuinely live read path in the same function (Project's non-lazy branch). The check that works is grep for assignments to the config field across non-test code. Prior instances were ContentDB.Add (dead method behind a live interface) and internal/contentkey. Pattern: when an epic ships a POLICY OBJECT, verify a composition root constructs it, not that its package is reachable."
