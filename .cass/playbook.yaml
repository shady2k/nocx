  - id: b-bd-106
    content: "Normalising an identifier before a list lookup has OPPOSITE safety directions depending on the list. Over-matching a DENY-list refuses more (safe); over-matching an ALLOW-list permits more (unsafe). Measured in nocx cmdeffect.go: one normalizedProgram() = filepath.Base + strings.ToLower fed three call sites — 'SUDO'->'sudo' hit disqualifyingWords and correctly refused, while 'LS'->'ls' hit readPrograms (an allow-list) and lowered the effect all the way to observe, because on Linux LS is a different binary. Correct shape is Base shared, ToLower only for deny-list callers. So a single shared normaliser whose correctness depends on which list the caller consults is MORE dangerous than two, because nothing at the call site says which kind it is. Ask 'which direction does over-matching move this?' before sharing any normaliser."
