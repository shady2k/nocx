  - id: b-bd-082
    content: "lesson (Orca worker waves, nocx): never leave two 'orchestration check --wait' supervisors running at once. When I replaced a supervisor that had swallowed stale mail, I started the new one WITHOUT stopping the old one, so for ~17 minutes both competed to consume the same queue. The old one won a live worker's report (SETTINGS-3, task_4041519c340a) and it landed in the SUPERSEDED task's output file, where I only found it because its exit notification made me look. check --wait CONSUMES messages, so concurrent supervisors silently split the mail between two places. Before starting a replacement supervisor, kill the previous background task (TaskStop) and then reconcile with the non-consuming 'orchestration check --all --json'."
