  - id: b-bd-135
    content: "tooling: never put backticks in a bd reason, a bd note or a git commit message passed as a double-quoted shell argument — bash executes them and the text arrives mangled with 'command not found' on stderr. Bitten twice on 2026-08-31 writing nocx close reasons and a merge commit, both times silently dropping the identifier being quoted, which is exactly the part that mattered. Use a quoted heredoc (<<'EOF') into --body-file/-F, or plain quotes instead of backticks. The failure is silent in the artefact: the bead or commit is written, just missing words."
