  - id: b-bd-141
    content: "When a coordinator tells a worker to REMOVE code because its caller lives in a later bead, require a park tag in the same instruction: git tag park/<bead> before deleting. Learned 2026-08-14 on nocx-457v. Two beads hit this within an hour. The nocx-aggw worker parked deploy.Uninstall at park/nocx-aggw-uninstall spontaneously and its work survived intact; the nocx-8d6e worker was told the same thing without the park requirement, removed consent.Store.Grant and writeDoc from its working tree BEFORE its only commit, and the code became unrecoverable — absent from history, reflog, stashes and every dangling blob, which the coordinator verified by scanning them. A promise in a bead note that the code 'will be restored from that branch' is worthless if the code was never committed to it. The deferral pattern itself is right and is forced by the deadcode ratchet; only the parking step was missing."
