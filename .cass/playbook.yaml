  - id: b-bd-050
    content: "Lazy tool presentation in internal/agenttools/presentation.go is DELIBERATELY dormant — do not wire it. AskParams.Presentation is unset in production on purpose: the owner built the feature for the day the tool catalog grows, and decided 2026-09-02 that it stays untouched until then. Measured that day: 20 eligible tools = 2137 schema tokens against DefaultSchemaTokenLimit = 4096, and Project computes lazy := cfg.Lazy && tokens >= limit, so setting the field is a no-op anyway. Do not lower the limit to make it fire — it hides notes.*, snippets.*, fetch.url and session.run behind a search the model must think to call, which is worse on small local models. See nocx-7icvn (closed deliberate) and nocx-2m4xh (closed duplicate)."
