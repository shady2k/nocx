  - id: b-bd-070
    content: "lesson (nocx, internal/content): bumping schemaVersion is THREE edits, not two. The rung and its schemaDigest are the obvious pair; the third is pinning the OUTGOING version's shape in schemaShapeDigests (schema_migrate.go:260) plus its schemaNNObjectNames() in historicalSchemaObjectNames. While a version is current its shape is derived at runtime; the moment it stops being current it must be pinned, or validateOnDiskSchemaShapeFor takes the !ok branch, finds a ladder step from that version, and REFUSES Open — so every database the previous build wrote falls back to content.NewStub (app.go:811) and history, layout and api-runs degrade silently. TestMigratableRungWithoutHistoricalShapeIsRefused asserts this refusal and passes while it is broken. The pinned digest must be taken from a database built by the OUTGOING tree's schemaV1, never regenerated from the current one — a shape pinned from the new tree makes Open accept a database it has not checked, which is worse than leaving it unpinned. Found by review on nocx-e5f55, 2026-09-05; testdata/ held only schema_v13.sql and v14.sql, so nothing exercised an upgrade from the version that was current the day before."
    category: workflow
    kind: workflow_rule
