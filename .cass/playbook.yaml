    scope: global
    category: workflow
    content: "nocx long gates under Claude Code: setsid alone is NOT enough. Two go
      test runs were killed at a turn boundary on 2026-09-05, the second under
      setsid, its log empty. What survives is full detachment from the harness:
      nohup setsid bash -c '<cmd> > LOG 2>&1; echo RUN-FINISHED >> LOG' & then
      watch LOG with a Monitor until-loop for the sentinel. setsid moves the
      process group; the harness kills by task; those are different things."
