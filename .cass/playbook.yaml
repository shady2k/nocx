  - id: b-bd-136
    content: "trap (Playwright): test.fail() called in a describe BODY applies to every test that follows it in that block, not to the next one. Doing it by mistake marked five passing cases as expected-failures, and the run then reported '50 passed' with no failures — i.e. the suite looked HEALTHIER than the correct one, which is why it is easy to miss. Put test.fail() inside the test function body instead. Found 2026-07-27 while accepting the kit proof matrix (nocx-1ixi)."
