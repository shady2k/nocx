  - id: b-bd-130
    content: "Test runners that transpile do not type-check: vitest, jest+SWC and esbuild strip types and run. A worker can therefore report 'all tests pass' truthfully while its files do not compile. Seen twice in one wave on 2026-07-27 (nocx-xrrl.6 shipped two copies of serializeLine, the second referencing an undefined variable; nocx-imkb.3 deleted a JSX nav/ul opening pair and left the closing tags). Runtime takes the first definition and never reaches the dead code, so the suite is green. Any brief that forbids repo-wide gates MUST carve out tsc --noEmit, and say why, or this recurs."
