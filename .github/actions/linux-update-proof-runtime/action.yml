# What a real-AppImage update proof needs from a Linux host: the Go toolchain
# that builds the manifest verifier, a display and a session bus, and the
# accessibility tree the shipped GTK/WebKit window is driven through. Shared
# by the nightly and stable proofs so the two cannot drift into proving on
# different desktops — a missing package here reads as an empty tree and a
# 20-minute timeout, not as a missing dependency (nightly run 40870717737).
name: Linux update proof runtime
description: Install the toolchain and desktop an AppImage update proof runs on.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache: true

    # `/usr/bin/python3` is deliberate everywhere the proofs are invoked:
    # python3-pyatspi installs into the distro's dist-packages and a
    # setup-python interpreter cannot see it.
    - name: Install the desktop the product expects
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          xvfb dbus dbus-daemon dbus-x11 at-spi2-core \
          python3-gi gir1.2-atspi-2.0 python3-pyatspi \
          libgtk-3-0t64 libatk-bridge2.0-0 fonts-dejavu-core \
          libgl1 libegl1 libgles2 libgl1-mesa-dri \
          libxkbcommon0 libxdamage1 libxfixes3 \
          libxrandr2 libxcomposite1 libxrender1 libxtst6
        # GL comes from the host, as on every desktop: WebKitGTK aborts at
        # webview creation without libGLESv2 ("Couldn't open libGLESv2.so.2",
        # nightly run 40870717737), and Mesa's software driver is what an X
        # server with no GPU renders through.
        # The driver sets GTK_MODULES=gail:atk-bridge, which GTK loads from the
        # module directory compiled into the GTK the image bundles; the host's
        # libgtk-3-0t64 is what puts a copy at that path. Without a bridge the
        # window still draws and the tree the driver reads is empty, so this is
        # a requirement, not an optimisation.

    - name: Record whether this host can mount an AppImage at all
      shell: bash
      run: |
        set -euo pipefail
        if [ -e /dev/fuse ] && ldconfig -p | grep -q 'libfuse\.so\.2'; then
          echo "FUSE is present: the runtime may mount, and the proof extracts anyway."
        else
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "No FUSE here: every AppImage run below extracts instead of mounting."
        fi
