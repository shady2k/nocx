    content: "nocx: deadcode -filter cannot fail on internal/content — RTA marks every method reached through an interface as reflection-reachable, so the filter form has always printed nothing there whether or not the write path had a production caller. That is the package where a dead write path once shipped (ContentDB.Add). Ask 'deadcode -tags gtk3 -whylive <pkg>.<Type>.<Method>' and read the contrast between a wired symbol and an unwired one. The .githooks ratchet shares the blind spot: a dead METHOD behind a live interface is invisible to it, and AD-8 puts every module behind one. So deadcode is a floor for 'is this symbol dead' and can never answer 'is this feature wired' — that is rule 2's end-to-end check. Measured 2026-08-18 with three probes in one run (nocx-re6gk)."
