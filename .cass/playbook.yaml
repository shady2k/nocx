  - id: b-bd-113
    content: "playbook (Orca workers: omp/pi) — how to run a worker wave, learned the hard way twice.\n\nDELIVERY. 'orchestration dispatch --inject' is NOT delivery. With omp the spec lands as an unsubmitted paste ('[Paste #1, +N lines]' in the pane); with pi it may not land at all. Always follow with 'orca terminal send --terminal <h> --text \"\" --enter'. For very long specs prefer: terminal send a SHORT one-line pointer to a brief FILE on the same host, with the worker_done command (taskId+dispatchId+coordinator handle) inside that file.\n\nPROOF OF START. dispatch-show returning 'dispatched' and 'terminal wait --for tui-idle' returning 'running' are NOT proof the worker began. Only .result.terminal.tail showing a live spinner is. Skipping this check cost ~10 min of two idle workers while the coordinator reported the wave as running.\n\nFRESH SESSION PER TASK. Never hand a new task to an idle worker that already finished one: the stale preamble carries the previous taskId/dispatchId and can misattribute worker_done; pi also refuses outright ('already has an active dispatch'). A fresh terminal costs ~20s — always cheaper than the confusion.\n\nSTALE HANDLES. When the Orca runtime restarts (runtimeId in _meta changes), pane handles are replaced. 'terminal read' on a stale handle returns an EMPTY tail, indistinguishable from a dead worker — re-resolve via 'terminal list' before concluding a worker died. I wrongly declared a healthy worker dead this way.\n\nSCOPE SPLIT. Split by MEASURED file distribution, never by assumption. Splitting eslint work by guess produced a no-op worker: all 123 errors sat in the 3 files the other worker owned. File-level ownership is the unit of parallelism in a shared worktree; if two tasks need the same file, the coordinator makes the tiny unblocking edit FIRST, then fans out on disjoint files.\n\nTRUST NOTHING, DIFF EVERYTHING. worker_done prose is a claim, not evidence. A worker reported 'CSP added' while shipping script-src 'unsafe-inline', which negates the exact XSS defence the task existed for, and silently skipped its explicit instruction to state what it could not verify. Review the diff against the acceptance criteria every time.\n\nBASELINE BEFORE BLAME. Before attributing a failing gate to your own change: git stash -u -> measure -> git stash pop. That is how 46 red tests were proven pre-existing rather than caused by the edit under review.\n\nWORKER GROUND RULES to put in every spec: no commit/push/branch, no repo-wide gates, no prettier/formatting (it collides), targeted tests only, do not touch beads. Coordinator runs all gates once at end of phase and owns bd.\n\nPARSING. orca JSON output is prefixed with a '[relay-connect] Handshake OK' line — strip it before jq/python."
    category: workflow
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
    source: learned
