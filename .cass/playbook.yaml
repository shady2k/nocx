  - id: b-bd-074
    content: "lesson (nocx, resolving a conflict where two branches rewrote one function): a resolution can be correct LINE BY LINE and still drop a policy, because the policy had no name to grep for. 2026-08-29, merging PR #121's cancel ladder with PR #128's Stop honesty. Both rewrote internal/transport/foreground_signal.go from opposite ends. The resolution took .11's stopProcessGroup verbatim — correct, it is what holds the addressee — but .11's function REPLACED main's stopForeground, and main's tail carried a rule .11 never had: when every rung failed and none was the guard, answer 'unreconciled', never 'nothing-running', because the second is a refusal a person acts on. The merged tail answered nothing-running. Reachable via EPERM from kill(-pgid) (sudo inside the execution), and it is the exact sentence nocx-7l4ex.12 was filed as.\n\nThree separate traps of this same shape landed in ONE merge that day. All three survive a compiler and both test suites. Two were found by grepping for names (cooperatedForeground, ErrProtectedForeground); the third had no name and was found ONLY by reading the merged function top to bottom against the version it replaced.\n\nSo: when a merge replaces one whole function with another, diff the two BODIES for rules, not the file for identifiers. Ask of every early return in the version being dropped: what does this one refuse to claim, and does the survivor still refuse it? A grep over names cannot ask that question. See [[a-stop-is-a-conversation-with-one-process]], nocx-yqwdi, nocx-iuzak."
    category: workflow
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
