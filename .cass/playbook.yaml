  - id: b-bd-085
    content: "На этой машине спонтанно растёт load average при почти свободном CPU — виноват не счёт, а форки. TestCommitTransportLossIsIndeterminate (internal/git/helper) ставит pre-commit хук с активным опросом 'while [ ! -f release ]; do sleep 0.02; done', а release лежит в t.TempDir(), который Go удаляет по завершении теста: гонка окном 20 мс, и проигравший крутится вечно. 2026-08-29 их накопилось 62 штуки за 5 суток = 2364 форка/с, load 35-74 на 6 ядрах, при том что суммарный CPU всего 31%. Диагностика дважды ушла по ложному следу, потому что ps показывает десятки 'git commit -F -' и это читается как 'агенты застряли на коммитах'. Проверка: pgrep -cf 'sh .git/hooks/pre-commit'. Уборка: pkill -f 'sh .git/hooks/pre-commit' (осторожно: pkill по шаблону 'git commit -F -' убивает и собственную оболочку, чья командная строка содержит шаблон). Бид nocx-hgtt0."
