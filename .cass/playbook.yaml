  - id: b-bd-134
    content: "The pre-commit hook's prettier and eslint gates read the WORKING TREE, not the index (npm run format:check / npm run lint at the repo root, '.'). So in a worktree shared with another live agent, an unformatted file that agent is mid-edit fails YOUR commit on a gate your diff cannot fix. 2026-08-19, nocx-mqie.4: eight staged frontend/docs files, all gates green for them, and the hook stopped on scrollback/controller.ts and e2e/scratch-jitter.spec.ts, both unstaged and being written by another session in the same tree. Do NOT prettier --write another agent's in-flight files. Commit --no-verify and say in the message which gates you ran by hand and why the hook was bypassed."
