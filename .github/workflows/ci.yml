# CI — quality gates for nocx.
#
# Runner decision: macOS 15 because:
#   - darwin is the target platform for this macOS-first MVP (see
#     docs/architecture.md § "Operational / Environmental Envelope"), so CI
#     should build and test what ships to users;
#   - internal/pty exercises creack/pty, and PTY semantics differ between macOS
#     and Linux — those tests are only meaningful on the target OS;
#   - macos-latest moved to macOS 26, where sandbox-exec aborts before its
#     child starts. Pinning 15 keeps the Seatbelt release gate executable.
# (Note: wails/v2 also requires GTK3/WebKit2GTK on Linux; the decision stands
# on the target-OS argument alone, without measuring ubuntu.)
# The pre-commit hook and the Makefile `ci` target mirror this same set of
# checks so "green" is identical locally and in CI.
#
# Trigger decision: CI runs on pull requests to main, on release branches
# (release/**) and manual workflow_dispatch, and is *called* by release.yml via
# workflow_call so a tag release cannot exist without a green run on that exact
# commit. The `pull_request: [main]` trigger is the mechanical gate on main
# (nocx-q36): the local pre-commit hook and `make ci` give the same checks as
# fast feedback, but a hook is bypassable with --no-verify and `make hooks` is a
# per-clone step a fresh checkout may skip, so CI is what actually enforces "no
# merge without green". The standalone `push: tags: ['v*']` trigger stays gone:
# with release.yml calling this workflow, keeping it would run the whole suite
# twice for every release for no added protection (see distribution design §5).

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['release/**']
  workflow_dispatch:
  workflow_call:

# Least privilege: the quality gates only read the repo. When release.yml calls
# this workflow the effective token is the intersection with what the caller
# grants, so the publish job's write scope never reaches these jobs.
permissions:
  contents: read

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          UNFMT=$(gofumpt -l .)
          if [ -n "$UNFMT" ]; then
            echo "gofumpt: the following files need formatting:"
            echo "$UNFMT"
            exit 1
          fi
          echo "gofumpt: all files formatted"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      # The shipped profile directory lives behind `-tags release`
      # (internal/storage/appdir.go), so the ordinary run never compiles it. One
      # package, one assertion — but without it a typo there ships an app that
      # cannot find any existing installation's documents.
      - name: Test (release build tag)
        run: go test -race -count=1 -tags release ./internal/storage/...

  # backend-linux — Go tests on Linux, with and without a Secret Service.
  #
  # Runner decision: ubuntu-latest is the standard CI Linux image. The macOS
  # backend job tests the target OS; this job tests Linux behaviour, which
  # matters because go-keyring's back end is platform-specific and the
  # release pipeline ships a linux/amd64 AppImage.
  #
  # Matrix decision: two variants (with-keyring: true / false) in one job
  # rather than two separate jobs. Rationale: common steps (checkout,
  # setup-go, build) appear once; GitHub auto-labels each variant; one job
  # ID for required checks.
  backend-linux:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with-keyring: [true, false]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install Secret Service & dbus-x11
        if: matrix.with-keyring
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11

      - name: Build
        run: go build ./...

      - name: Test (with Secret Service)
        if: matrix.with-keyring
        run: |
          dbus-run-session -- bash <<'TESTEOF'
          set -euo pipefail
          echo "=== Starting gnome-keyring-daemon ==="
          eval "$(echo -n "nocx-ci" | gnome-keyring-daemon --daemonize --login)"
          echo "=== Unlocking login keyring ==="
          echo -n "nocx-ci" | gnome-keyring-daemon --unlock
          echo "=== Running tests ==="
          go test -race -count=1 ./...
          TESTEOF

      - name: Test (no Secret Service)
        if: '!matrix.with-keyring'
        run: go test -race -count=1 ./...

      # Real Landlock enforcement smoke (ADR-0019 §8). The release gate that
      # proves the cage behaves on Linux; it fails loudly when the runner's
      # kernel is below Landlock ABI 3 — a runner that cannot run it must be
      # replaced, never silently skipped.
      - name: Sandbox enforcement smoke (Landlock)
        run: make sandbox-smoke-linux

  frontend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # e2e — the checks that only exist in a real browser against the real app.
  #
  # Runner decision: macOS 15, the last hosted image where sandbox-exec runs
  # its child reliably; macos-latest now resolves to macOS 26 and aborts before
  # Seatbelt can enforce the probe.
  # Playwright drives the actual frontend through Vite and the actual backend
  # through devharness. Wails itself is intentionally absent: it would compile
  # and launch an unused native webview, while masking the headless binding
  # path the e2e suite declares. Both browser engines still exercise the same
  # real PTY and WebSocket transport.
  e2e:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: cd frontend && npm ci
      # Both engines the suite declares. WebKit is not a luxury here: the app
      # ships inside WKWebView, so WebKit is the closer of the two to what users
      # run, and installing only chromium would fail the run outright.
      - run: npx playwright install chromium webkit

      # Vault and history specs restart isolated backend instances. Build the
      # deterministic binaries they require before Playwright starts.
      - name: Build e2e devharness binaries
        run: |
          go build -o /tmp/nocx-devharness ./cmd/devharness
          cp /tmp/nocx-devharness /tmp/nocx-devharness-vault
          cp /tmp/nocx-devharness /tmp/nocx-devharness-srch

      - name: Run headless e2e
        run: |
          set -euo pipefail
          home="$GITHUB_WORKSPACE/.e2e/home"
          mkdir -p "$home"

          HOME="$home" XDG_CONFIG_HOME= XDG_DATA_HOME= XDG_CACHE_HOME= ZDOTDIR= BASH_ENV= ENV= \
            NOCX_WS_ADDR=127.0.0.1:9876 /tmp/nocx-devharness > /tmp/nocx-e2e-backend.log 2>&1 &
          backend_pid=$!
          vite_pid=''
          cleanup() {
            kill "$backend_pid" 2>/dev/null || true
            [ -z "$vite_pid" ] || kill "$vite_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          # The macOS keychain availability probe may take tens of seconds in
          # a non-interactive runner before devharness prints its token.
          for _ in $(seq 1 600); do
            token="$(perl -ne 'if (/^WSTOKEN=(.*)/) { print $1; exit }' /tmp/nocx-e2e-backend.log)"
            if [ -n "$token" ]; then break; fi
            sleep 0.1
          done
          test -n "${token:-}" || { cat /tmp/nocx-e2e-backend.log; exit 1; }

          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173) > /tmp/nocx-e2e-vite.log 2>&1 &
          vite_pid=$!
          for _ in $(seq 1 150); do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null

          NOCX_WS_PORT=9876 NOCX_WS_TOKEN="$token" NOCX_BASE_URL=http://127.0.0.1:5173 \
            NOCX_E2E_HOME_DIR="$home" npx playwright test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
