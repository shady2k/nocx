  - id: b-bd-123
    content: "reference (Orca orchestration + pi workers): 'orca orchestration dispatch --inject' does NOT type the task into a pi worker's TUI — it creates the dispatch record but the prompt never lands (worker sits idle at startup banner). Deliver instead via 'orca terminal send --terminal <h> --text <short one-line pointer> --enter' pointing the worker at a brief FILE on the same host, and put the worker_done command (with taskId+dispatchId+coordinator handle) inside that file. Confirm pickup by reading .result.terminal.tail (shows 'Working...'). Also: a terminal with a completed OR active dispatch blocks a new dispatch ('already has an active dispatch') — use a fresh terminal. orca JSON output is prefixed with a '[relay-connect] Handshake OK' line — strip it before jq/python."
