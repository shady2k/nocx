  - id: b-bd-048
    content: "integration: take a worker's diff against the commit its worktree was CUT FROM, never against the integration branch — that branch moves as you merge, so `git -C <wt> diff <branch>` yields a REVERSE patch of everything merged since, and applying it silently reverts a colleague's task. Nearly reverted nocx-zd1vp that way on 2026-08-21; `git apply --check` passes, because the reverse patch is perfectly valid. Use the cut-point sha, and grep for a symbol the other task added before committing."
