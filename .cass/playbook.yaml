  - id: b-bd-065
    content: "lesson (nocx e2e/test waits, measured 2026-08-25/26, two instances in one session): a wait that closes on ONE condition while the following assertions read OTHERS is the repo's recurring flake shape — poll the CONJUNCTION of everything the assertions depend on. nocx-2qo02: api-testing.spec.ts polled for the collection directory then read api-bindings.json once; ImportInto renames into place and only THEN binds (write.go step 5), and each bind is a vault write, so dest exists while the document does not. nocx-sx4sg is the worse form — grid-width.spec.ts polled 'grid not wider than the scroller' and an UN-FITTED grid is much narrower, so the predicate was satisfied BY the failure state the next line rejects (webkit fill 0.576 vs >0.98). Both were green for weeks and went red only on a loaded runner. Make the polled value carry the numbers, not a boolean: a CI timeout has to say which half failed and by how much. Check for this shape whenever a spec has expect.poll followed by a bare expect on the same subject."
