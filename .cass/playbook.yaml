  - id: b-bd-127
    content: "rule (nocx, stated by the owner 2026-07-27, applies to every agent and every wave): NO IMPLEMENTATION FORKS. Behaviour must not branch on a mode string, a flag parameter or a type test; when behaviour has to vary off a base type, that variation is expressed as an abstraction — a method the subtype overrides, or a policy object the caller supplies. Two concrete cases caught in one review wave on nocx-njrx: (1) settings.ts refresh(mode: 'normal'|'resync') choosing AcceptedSnapshot.reset vs .accept inside an if — the thing that varies is the revision policy, so the policy is the parameter and the method body has no branch; (2) three TabContent implementations each carrying a private _target plus an identical classList.toggle('active') — one behaviour copied three times, which is how the fourth implementation forgets it. The second is the same defect shape as TerminalContent's private 'started' flag that made mount-once hold by coincidence rather than at the seam. Corollary, equally binding: code that a migration replaces is DELETED in the commit that lands the replacement — no shim, no re-export, no 'kept for now', no old path left beside the new one. A surface is not migrated while both versions exist."
