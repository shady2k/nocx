  - id: b-bd-030
    content: "CORRECTED AGAIN 2026-09-03, and the correction is the important half. The earlier text said: do not file a bead for an e2e flake, append to nocx-6wgcw, and rerun the failed job — 'if it passes, that IS the evidence it was a flake'. AGENTS.md now forbids exactly that: see its section 'There is no \"not ours\"'. A rerun is legitimate once, to see the failure a second time; a green rerun is NOT evidence the defect is gone, only that it did not fire. A flake is a defect, not weather.\n\nWhat to do instead, and it works: pull the artefacts. gh api repos/shady2k/nocx/actions/runs/<id>/artifacts gives playwright-traces-<browser>; inside are error-context.md (the DOM at failure), trace.zip (every action with timestamps and screencast frames) and the backend logs. Three specs out of nocx-6wgcw have now been taken to a named cause that way, and all three causes were DIFFERENT — a sealed vault on the shared stand, a round trip for the destination folder, a wrong latch in the spec itself. So do not assume the twelve share one cause.\n\nAnd one trap that cost an hour: git-remote.spec.ts captures a dead connection and 'lifecycle remote transport lost cause=closed' in its DOM and logs. That is the spec's own finally sending the fixture SIGKILL before the trace is written — cleanup, not the failure. Read what finally does before believing any captured end-state."
