  - id: b-bd-066
    content: "lesson (nocx e2e verification): a bare 'npx playwright test' goes through the webServer stanza and therefore 'wails dev', which cannot build on a headless Linux box (webkit2gtk-4.0 absent) and burns the full 240s webServer timeout before failing. The working path is headless: devharness on a pinned NOCX_WS_ADDR, vite started separately, then playwright with NOCX_WS_PORT and NOCX_WS_TOKEN — the token is MANDATORY because harness.ts fails fast without it, the token being the auth gate. Full procedure in .internal/reports/devharness-verify.md. Recorded because I instructed three workers to use this path and then verified their green with the bare command myself; it failed on the environment and briefly looked like their result was false. Read the procedure before reproducing someone else's run."
