    content: "herdr worker dispatch: a prompt containing a filesystem path can be swallowed by the agent's own path autocompletion - omp opened a file-completion popup on the /tmp/... brief path and Enter selected a completion instead of submitting, leaving the whole prompt sitting unsent in the input box while agent prompt returned ok and the pane read as idle. Always read the pane after dispatching; recover with herdr agent send-keys <name> esc then enter. This is a second reason to keep briefs in files and the pointer short, and it means 'agent prompt returned ok' is never evidence the prompt landed."
