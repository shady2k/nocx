# Release — build, verify, sign and publish macOS + Linux artefacts.
#
# Design: docs/superpowers/specs/2026-07-22-distribution-and-updates-design.md
# (§4 versioning, §5 pipeline, §6 manifest). macOS .app + Linux AppImage (D1
# reversed per ADR-0007).
#
# Shape of the pipeline:
#   - A real release comes from a stable version tag and *only* from a tag: a
#     manual run has no tag and cannot produce the /releases/download/v<ver>/…
#     URLs the manifest asserts, so workflow_dispatch is a dry run that builds,
#     signs and verifies everything and publishes nothing (§5).
#   - The whole quality suite must be green on this exact commit before anything
#     is built: release.yml *calls* ci.yml (workflow_call) and every downstream
#     job needs it. `needs:` alone would not do this — it does not reach across
#     workflows — which is why ci.yml is a called workflow, not a sibling.
#   - The signing key lives only in the publish job, which runs no build tooling.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the publish job is granted contents: write, and it
# only runs for a real tag release.
permissions:
  contents: read

jobs:
  # The gate. A release cannot exist without green backend, frontend and e2e on
  # this commit.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Resolve the version and decide whether this run publishes. Git-only, so it
  # runs on ubuntu in parallel with the macOS build gate.
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      notes: ${{ steps.notes.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Resolve and validate the version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            # Stable vMAJOR.MINOR.PATCH only. CFBundleVersion has a narrower
            # grammar than semver, so a prerelease tag would produce an invalid
            # plist, and GitHub's `latest` excludes prereleases anyway (§4).
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag '$tag' is not a stable vMAJOR.MINOR.PATCH release"
              exit 1
            fi
            # The tagged commit must be reachable from main (a commit is its own
            # ancestor, so tagging main's tip is valid).
            git fetch --no-tags --depth=2147483647 origin main
            tagsha="$(git rev-parse HEAD)"
            if ! git merge-base --is-ancestor "$tagsha" FETCH_HEAD; then
              echo "::error::tag commit $tagsha is not reachable from main"
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Dry run: no tag, so no release URLs. 0.0.0 is a valid
            # CFBundleVersion and never collides with a shipped release.
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # THE NOTES TRAVEL AS AN ARTEFACT, because `publish` holds no source.
      # `publish` used to test `-f docs/release-notes/v${VERSION}.md` against
      # its own empty working directory, so the test could never pass and every
      # release shipped the fallback with a ::warning:: nobody read — v0.2.0 and
      # v0.3.0 both had notes written for them and neither published them
      # (nocx-woh3s).
      #
      # The fix is not a checkout in `publish`: the comment on that job's
      # `GH_REPO` says why, and it still holds — cloning the source to satisfy
      # an implicit lookup hides what the lookup actually needed. This job
      # already has the source and already resolves VERSION, so it is the one
      # that can answer "are there notes for this version" and hand the answer
      # forward. `publish` then consumes the notes the way it consumes the
      # binaries and the manifest.
      #
      # No file, no artefact, and the `notes` output says so: `publish` skips
      # the download and its fallback fires for the real reason. A dry run
      # (VERSION 0.0.0, no such file) takes that branch and uploads nothing,
      # which is why the upload is conditional rather than
      # `if-no-files-found`-tolerant — an artefact that does not exist must not
      # be downloaded either.
      - id: notes
        name: Stage the release notes, if this version has any
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/v${VERSION}.md"
          if [ -f "$notes_file" ]; then
            mkdir -p staged-notes
            cp "$notes_file" staged-notes/notes.md
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "staged $notes_file ($(wc -c < "$notes_file") bytes)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no $notes_file in the tree; publish will use the install caveat"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.notes.outputs.present == 'true'
        with:
          name: release-notes
          path: staged-notes/notes.md
          retention-days: 7

  # ONE ORIGIN FOR THE HELPER BYTES (nocx-6de7c). The helpers used to be
  # built by BOTH build jobs and `sign` compared the two results; run
  # 33319938229 found all four differing. The cause is the toolchain, not
  # the code: `go-version: '1.26'` resolves whatever patch release the
  # runner image happens to hold — go1.26.5 on macOS, go1.26.7 on Linux —
  # and a different compiler is different bytes. The consequence was not
  # corruption, because install.go keys the install directory by content
  # hash (D7), but a published helper that was not the one half the
  # installs deploy, costing a hand-installed helper one automatic
  # reinstall (D6).
  #
  # The owner chose ONE ORIGIN over a reproducibility promise on
  # 2026-08-30: build them once, here, and have both build jobs embed THIS
  # artefact. Identity by construction rather than by two toolchains
  # happening to agree.
  #
  # `needs: [validate]` is for VERSION alone — the published file names
  # carry it.
  helpers:
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build the remote helpers
        run: make helpers
      - name: Verify helper build output is stable and bounded
        run: go test -tags helperacceptance ./internal/helper/deploy/artifacts -run 'TestMakeHelpersIsIdempotent|TestHelperArtifactsStayBelowSizeCeiling' -count=1

      # The COMPRESSED artefacts, exactly as `make helpers` leaves them:
      # //go:embed all:bin takes the .gz files, so these are what the
      # build jobs download back into place before the Go build that embeds
      # them.
      - uses: actions/upload-artifact@v7
        with:
          name: helper-artifacts
          path: internal/helper/deploy/artifacts/bin/*.gz
          retention-days: 7

      - name: Stage the helper binaries for publication
        run: |
          set -euo pipefail
          # PUBLISHED UNCOMPRESSED, deliberately. `make helpers` gzips, and
          # gzip stamps the source file's mtime into its header, so the .gz
          # bytes differ between two runs even when the binary inside is
          # identical. The DECOMPRESSED bytes are what
          # internal/helper/deploy/install.go hashes to key the install
          # directory, so publishing those makes "the same bytes the ssh
          # path would have sent" a checkable claim: a hand-installed
          # helper lands in the same directory name, and no
          # reinstall-on-hash-mismatch follows.
          #
          # The loop takes the platforms from the artifacts on disk rather
          # than from a list written here, so the matrix can grow (it goes
          # 2x2 in nocx-psjfb) without this step being edited to match.
          #
          # shasum -a 256, not sha256sum: macOS has no sha256sum, Linux has
          # both, and one spelling that works in either job is worth more
          # than the shorter one.
          mkdir -p dist
          : > helper-hashes.txt
          for gz in internal/helper/deploy/artifacts/bin/nocx-helper-*.gz; do
            name="$(basename "$gz" .gz)"          # nocx-helper-<goos>-<goarch>
            plat="${name#nocx-helper-}"
            out="dist/nocx-helper-${VERSION}-${plat}"
            gunzip -c "$gz" > "$out"
            chmod +x "$out"
            printf '%s %s\n' "$plat" "$(shasum -a 256 "$out" | awk '{print $1}')" >> helper-hashes.txt
          done
          sort -o helper-hashes.txt helper-hashes.txt
          cat helper-hashes.txt

      # The published binaries, for `publish`, and for `sign` to size in
      # the manifest. They come from this job and from nowhere else: no
      # build job stages a helper under dist/ any more, so one file name
      # cannot arrive twice in one download directory and let step
      # ordering decide which bytes users get.
      - uses: actions/upload-artifact@v7
        with:
          name: helper-binaries
          path: dist/nocx-helper-*
          retention-days: 7

      # The hashes of those same bytes — what `sign` holds both build jobs
      # against, and what the manifest publishes as each helper's sha256.
      - uses: actions/upload-artifact@v7
        with:
          name: helper-hashes
          path: helper-hashes.txt
          retention-days: 7

  # Named for its platform, like build-linux. It was `build` back when macOS was
  # the only target and the qualifier carried no information; once ADR-0007
  # reversed D1 and added the AppImage, an unqualified `build` next to a
  # `build-linux` read as "the build" and hid which platform had failed.
  build-macos:
    needs: [ci, validate, helpers]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Pinned to the version in go.mod, like the e2e job. The macOS job still
      # needs the CLI (build-assets generates the Info.plist and icon bundle;
      # the Linux job builds with plain go build and does not).
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: Generate macOS bundle assets
        run: |
          set -euo pipefail
          # v3 has no wails.json; the version that used to be patched into it
          # (info.productVersion -> CFBundleShortVersionString/CFBundleVersion)
          # is now a build-assets flag. The CLI also embeds the icon and
          # generates the Info.plist template the .app assembly copies.
          # THE FLAG NAMES ARE THE STRUCT FIELDS, LOWERCASED, and nothing
          # else: clir derives them with `strings.ToLower(field.Name)`
          # whenever the field carries no `name:` tag (clir@v1.3.0
          # command.go:258), and BuildAssetsOptions tags only `description:`
          # and `default:`. So there are no word separators to insert —
          # `-binary-name` is not a spelling of `-binaryname`, it is a flag
          # that does not exist, and parsing stops at the first unknown one.
          # The icons step below is the same convention read correctly.
          wails3 generate build-assets \
            -dir build/assets \
            -binaryname nocx \
            -productname nocx \
            -productidentifier com.shady2k.nocx \
            -productversion "$VERSION"

      - name: Generate macOS icon bundle
        run: |
          set -euo pipefail
          # build/appicon.png is the ONE committed icon in the repository, and
          # the Linux job already derives its AppImage icon from it. macOS
          # derives its .icns from the same master here rather than expecting a
          # second asset to exist: `generate build-assets` above writes plists
          # and never an icon, so the assembly step below used to copy a file
          # that nothing in the pipeline had produced.
          #
          # -windowsfilename "" is load-bearing rather than tidiness: the flag
          # defaults to build/windows/icon.ico and the generator writes it with
          # a plain os.WriteFile, so leaving the default in place fails this
          # step on a directory this repo does not have.
          #
          # icons.icns, not the tool's default icon.icns: the Info.plist sets
          # CFBundleIconFile to "icons", so that is the name the bundle has to
          # carry. Wails' own Taskfile passes the same override.
          wails3 generate icons \
            -input build/appicon.png \
            -macfilename build/darwin/icons.icns \
            -windowsfilename ""
          test -s build/darwin/icons.icns

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      # The code-signing key is present in a job that runs build tooling, and
      # unlike the manifest key (§5, the `sign` job) it cannot be anywhere
      # else: codesign works on the assembled bundle, on macOS, in the job
      # that assembles it. The two keys stay distinct, so the manifest key's
      # isolation is exactly as strong as it was.
      - name: Import the signing certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MACOS_SIGNING_P12" ] || { echo "::error::MACOS_SIGNING_P12 is empty — the release cannot sign, and it must not fall back to ad-hoc"; exit 1; }
          [ -n "$MACOS_SIGNING_P12_PASSWORD" ] || { echo "::error::MACOS_SIGNING_P12_PASSWORD is empty"; exit 1; }
          kc_pass="$(openssl rand -hex 32)"
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" build.keychain
          # -lut: no auto-lock during the job. A keychain that relocks
          # mid-run makes codesign prompt, and a prompt on a runner is a
          # six-hour hang rather than a failure.
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$kc_pass" build.keychain
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k build.keychain \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          # SELF-SIGNED MEANS UNTRUSTED, and `find-identity -v` lists only
          # VALID identities — an untrusted certificate is not one. The
          # first run of this step reported "0 valid identities found" and
          # codesign failed 90 seconds later with "The specified item could
          # not be found in the keychain". Trusting our own certificate for
          # code signing is what makes the identity resolvable, and it
          # grants nothing beyond this ephemeral runner VM.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin "pass:$MACOS_SIGNING_P12_PASSWORD" -out "$RUNNER_TEMP/signing.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.crt"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.crt"
          # WITHOUT THIS LINE codesign asks for the keychain password
          # interactively and the job hangs instead of failing. -T on the
          # import grants codesign the ACL entry; the partition list is the
          # second half of the same permission on modern macOS.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain login.keychain
          # The SHA-1 is matched as a 40-hex field wherever it appears,
          # never by column on line 1: that parse read `0 valid identities
          # found` and yielded the word "valid", which is non-empty, so the
          # guard below passed and the failure surfaced in codesign instead
          # of here. A guard that cannot reject a wrong answer is not one.
          id="$(security find-identity -v -p codesigning build.keychain | awk '{ if (match($0, /[0-9A-F]{40}/)) { print substr($0, RSTART, RLENGTH); exit } }')"
          if ! printf '%s' "$id" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "::error::no code-signing identity in the imported keychain (got '"'"'$id'"'"')"
            security find-identity -p codesigning build.keychain
            exit 1
          fi
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning build.keychain

      # The helpers are EMBEDDED in the app (//go:embed all:bin), so
      # they must exist before the Go build that embeds them. Until
      # nocx-mchgh no step put them there at all and every published
      # release answered ErrArtifactsNotBuilt for every platform: remote
      # git could not work in any release, and worked from a checkout,
      # which is why nothing reported it (Makefile:125 makes build-release
      # depend on helpers; release.yml never did).
      #
      # They are DOWNLOADED rather than built here since nocx-6de7c — see
      # the `helpers` job for why two `make helpers` runs are not two
      # copies of one binary.
      - name: Download the helpers the `helpers` job built
        uses: actions/download-artifact@v8
        with:
          name: helper-artifacts
          path: internal/helper/deploy/artifacts/bin

      # The gate, expressed as a test rather than as a file listing: a
      # build that embedded nothing answers ErrArtifactsNotBuilt for every
      # platform, and NOCX_REQUIRE_HELPER_ARTIFACTS turns the skip that
      # protects a fresh checkout into the failure a release needs.
      #
      # Since nocx-6de7c it asserts THE DOWNLOAD LANDED AND WAS EMBEDDED,
      # not that `make helpers` ran in this job — and that is exactly the
      # failure a download step can produce silently. An artefact that
      # arrives empty, or under a path //go:embed does not read, leaves a
      # build that compiles cleanly and ships an app with no helper for
      # any platform.
      - name: The built binary embeds a helper for every matrix platform
        run: NOCX_REQUIRE_HELPER_ARTIFACTS=1 go test ./internal/helper/deploy/ -run 'TestEveryMatrixPlatformResolves|TestArtifactReturnsCompressedBytesAndDecompressedHash' -count=1

      - name: Build universal bundle
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X github.com/shady2k/nocx/internal/version.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/shady2k/nocx/internal/version.Commit=${GITHUB_SHA}"
          LDFLAGS="${LDFLAGS} -X github.com/shady2k/nocx/internal/version.Date=${BUILD_DATE}"
          # v3 has no -platform flag: build each slice and join with lipo (§4).
          #
          # CGO_ENABLED=1 AND THE -arch FLAGS ARE BOTH REQUIRED, and leaving
          # them out is not a slow build, it is a broken one. Naming GOARCH
          # explicitly makes this a CROSS build even on a Mac building for a
          # Mac, and Go turns cgo OFF for a cross build unless told otherwise
          # — so wails v3's darwin implementation, which is Objective-C
          # behind cgo, was excluded from the compile and the package it
          # belongs to failed on every symbol it defines: `undefined:
          # macosApp`, `undefined: newPlatformApp`, `undefined:
          # smAppServiceRegister`.
          #
          # With cgo back on, the C half still has to be told which slice it
          # is building; clang defaults to the host's architecture and would
          # otherwise hand arm64 objects to the amd64 link. Apple's clang
          # cross-compiles both from either host, so `-arch` on the CFLAGS
          # and the LDFLAGS is the whole of what it needs.
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -tags "release production" -ldflags "$LDFLAGS" \
            -o build/bin/darwin-amd64/nocx .
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_CFLAGS="-arch arm64" CGO_LDFLAGS="-arch arm64" \
            go build -tags "release production" -ldflags "$LDFLAGS" \
            -o build/bin/darwin-arm64/nocx .
          # The coordinator is a SECOND executable in the bundle: the desktop
          # app finds, spawns and attaches to it, so installing the app is
          # what installs the server (design §4, "Where the binary lives").
          # It is built here rather than fetched or generated later because
          # of the codesign line at the end of this step — see below.
          #
          # CGO_ENABLED=0 and no wails tags: cmd/nocx-server has no window.
          # It still needs both slices, because the app it is spawned by is
          # universal and a user on either architecture runs the same bundle.
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -tags release -ldflags "$LDFLAGS" \
            -o build/bin/darwin-amd64/nocx-server ./cmd/nocx-server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -tags release -ldflags "$LDFLAGS" \
            -o build/bin/darwin-arm64/nocx-server ./cmd/nocx-server
          mkdir -p build/bin/nocx.app/Contents/MacOS build/bin/nocx.app/Contents/Resources
          lipo -create -output build/bin/nocx.app/Contents/MacOS/nocx \
            build/bin/darwin-amd64/nocx build/bin/darwin-arm64/nocx
          lipo -create -output build/bin/nocx.app/Contents/MacOS/nocx-server \
            build/bin/darwin-amd64/nocx-server build/bin/darwin-arm64/nocx-server
          cp build/assets/darwin/Info.plist build/bin/nocx.app/Contents/Info.plist
          cp build/darwin/icons.icns build/bin/nocx.app/Contents/Resources/icons.icns
          # Sign inside-out. --deep is NOT used to sign: Apple deprecated it
          # for signing because it applies the outer options to nested code,
          # and here it would sign the coordinator as a by-product of signing
          # the app rather than as its own decision. It survives only in
          # --verify --deep --strict below, where it means "check nested code
          # too".
          #
          # -i on the coordinator because a bare Mach-O takes its identifier
          # from its FILE NAME, and the identifier is part of the designated
          # requirement the keychain matches on (ADR-0050 step 3). A
          # defaulted identifier is a requirement that can change without
          # anyone deciding to change it. The bundle needs no -i: it takes
          # CFBundleIdentifier from Info.plist.
          #
          # Order matters and the bundle is last: its signature seals
          # Info.plist, the icon and both executables, so anything that
          # touches the tree afterwards invalidates it.
          codesign --force --sign "$SIGN_IDENTITY" -i com.nocx.server \
            build/bin/nocx.app/Contents/MacOS/nocx-server
          codesign --force --sign "$SIGN_IDENTITY" build/bin/nocx.app

      # WHAT THIS JOB ACTUALLY EMBEDDED, hashed and thrown away. The
      # `helpers` job is the one origin for the bytes; this file is the
      # evidence that the origin is what landed here, and `sign` holds it
      # against that job's helper-hashes.txt. A build job that quietly
      # built helpers of its own, or that received a stale artefact, is red
      # there instead of shipping an app whose embedded helper is not the
      # published one — which is the whole reason a check survives in
      # `sign` at all.
      #
      # Staged under $RUNNER_TEMP and never under dist/, because dist/* is
      # what this job uploads, and the helper binaries are published from
      # the `helpers` job alone. One file name arriving twice in one
      # download directory would let step ordering decide which bytes users
      # get.
      #
      # UNCOMPRESSED, deliberately. `make helpers` gzips, and gzip stamps
      # the source file's mtime into its header, so the .gz bytes differ
      # between runs even when the binary inside is identical — hashing
      # those would compare the wrong thing. The DECOMPRESSED bytes are
      # what internal/helper/deploy/install.go hashes to key the install
      # directory, so they are what both this comparison and the published
      # asset are about.
      #
      # The loop takes the platforms from the artifacts on disk rather
      # than from a list written here, so the matrix can grow (it goes
      # 2x2 in nocx-psjfb) without this step being edited to match.
      #
      # shasum -a 256, not sha256sum: macOS has no sha256sum, Linux has
      # both, and one spelling that works in either job is worth more
      # than the shorter one.
      - name: Hash the helper bytes this job embedded
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/helper-stage"
          mkdir -p "$stage"
          : > embedded-hashes.txt
          for gz in internal/helper/deploy/artifacts/bin/nocx-helper-*.gz; do
            name="$(basename "$gz" .gz)"          # nocx-helper-<goos>-<goarch>
            plat="${name#nocx-helper-}"
            out="$stage/nocx-helper-${VERSION}-${plat}"
            gunzip -c "$gz" > "$out"
            printf '%s %s\n' "$plat" "$(shasum -a 256 "$out" | awk '{print $1}')" >> embedded-hashes.txt
          done
          sort -o embedded-hashes.txt embedded-hashes.txt
          cat embedded-hashes.txt

      - name: Smoke checks
        run: |
          set -euo pipefail
          APP="build/bin/nocx.app"
          BIN="$APP/Contents/MacOS/nocx"
          # 1. A universal Mach-O must carry both slices. This is not proof they
          #    both launch (§13 verifies that on hardware), only that lipo joined
          #    two architectures.
          archs="$(lipo -archs "$BIN")"
          echo "archs: $archs"
          echo "$archs" | grep -qw x86_64
          echo "$archs" | grep -qw arm64
          # 2. The plist version must match the linked Go version — both keys.
          plist="$APP/Contents/Info.plist"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          [ "$short" = "$VERSION" ] || { echo "::error::CFBundleShortVersionString=$short != $VERSION"; exit 1; }
          [ "$bundle" = "$VERSION" ] || { echo "::error::CFBundleVersion=$bundle != $VERSION"; exit 1; }
          # 3. The linked binary must report the same version.
          reported="$("$BIN" --version)"
          echo "reported: $reported"
          echo "$reported" | grep -qw "$VERSION"
          # 4. The signature must be intact — the baseline the payload round
          #    trip (§9) asserts is preserved through packaging. It is the
          #    project certificate's, not the ad-hoc one Wails used to apply:
          #    what changed is the signer, not the check.
          codesign --verify --deep --strict "$APP"
          # 5. The coordinator ships in the bundle, carries both slices, and
          #    carries a signature of its own — its own codesign call above,
          #    not a by-product of the bundle's.
          #
          #    There is deliberately no `--version` check here to match the
          #    one on nocx above: cmd/nocx-server takes no flags, and running
          #    it in CI would start a daemon rather than print a line. The
          #    two binaries are linked in the same step from the same
          #    $LDFLAGS, so the version they report cannot differ; when the
          #    coordinator grows a --version, assert it here and delete this
          #    paragraph.
          SRV="$APP/Contents/MacOS/nocx-server"
          test -x "$SRV"
          srv_archs="$(lipo -archs "$SRV")"
          echo "nocx-server archs: $srv_archs"
          echo "$srv_archs" | grep -qw x86_64
          echo "$srv_archs" | grep -qw arm64
          codesign --verify --strict "$SRV"

      - name: The designated requirement is the one we committed
        run: |
          set -euo pipefail
          # This string is what the keychain matches a process against
          # (ADR-0050 step 3). Committing it and comparing every build
          # against it is what turns "stable across releases" from a claim
          # into a gate: replace, rotate or mis-import the certificate and
          # this step is red, instead of the release quietly shipping an
          # identity no existing install recognises.
          #
          # The file cannot be written by hand: its content is what the real
          # certificate produces, read out of a dry run's log. An absent or
          # empty file is therefore an unfinished setup, not a passing
          # build, and it says so rather than comparing against "".
          # The built string is read FIRST and printed on the failure path,
          # because the run that has no committed file is exactly the run
          # somebody has to copy the string out of. Exiting without printing
          # it would cost a second full dry run to learn what this one
          # already knew.
          got="$(codesign -d -r- "build/bin/nocx.app/Contents/MacOS/nocx-server" 2>/dev/null)"
          [ -s build/darwin/requirement.txt ] || {
            echo "::error::build/darwin/requirement.txt is absent or empty — this build's requirement is the line below; commit it to that file and re-run"
            echo "$got"
            exit 1; }
          want="$(cat build/darwin/requirement.txt)"
          if [ "$got" != "$want" ]; then
            echo "::error::designated requirement changed"
            echo "committed: $want"
            echo "built:     $got"
            exit 1
          fi
          echo "requirement matches: $got"

      - name: The requirement survives a rebuild, and the code hash does not
        run: |
          set -euo pipefail
          # ADR-0050 recorded this property from one measurement on a
          # laptop. It is the property the entire design rests on, so it is
          # asserted on the artefact, every build: an ad-hoc signature's
          # requirement IS the code hash, and the whole point of the
          # certificate is that ours is not.
          LD="-X github.com/shady2k/nocx/internal/version.Version=${VERSION}"
          for stamp in A B; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags release \
              -ldflags "$LD -X github.com/shady2k/nocx/internal/version.Date=stamp-$stamp" \
              -o "$RUNNER_TEMP/srv-$stamp" ./cmd/nocx-server
            codesign --force --sign "$SIGN_IDENTITY" -i com.nocx.server "$RUNNER_TEMP/srv-$stamp"
          done
          req_a="$(codesign -d -r- "$RUNNER_TEMP/srv-A" 2>/dev/null)"
          req_b="$(codesign -d -r- "$RUNNER_TEMP/srv-B" 2>/dev/null)"
          cd_a="$(codesign -d --verbose=4 "$RUNNER_TEMP/srv-A" 2>&1 | sed -n 's/^CDHash=//p')"
          cd_b="$(codesign -d --verbose=4 "$RUNNER_TEMP/srv-B" 2>&1 | sed -n 's/^CDHash=//p')"
          [ "$req_a" = "$req_b" ] || { echo "::error::requirement changed between two builds:"; echo "$req_a"; echo "$req_b"; exit 1; }
          [ "$cd_a" != "$cd_b" ] || { echo "::error::the two builds have the same cdhash ($cd_a) — the check proves nothing as written"; exit 1; }
          echo "requirement stable across a rebuild; cdhash moved from $cd_a to $cd_b"

      - name: Package .dmg and .zip
        run: |
          set -euo pipefail
          APP="build/bin/nocx.app"
          base="nocx-${VERSION}-darwin-universal"
          mkdir -p dist
          # The .zip is the updater payload: ditto (not zip) preserves the
          # bundle's symlinks, executable bits and signature; --noqtn so no
          # quarantine attribute can ride along (§5).
          ditto -c -k --keepParent --noqtn "$APP" "dist/${base}.zip"
          # The .dmg is the human install path: a staging folder holding the app
          # and an /Applications symlink, compressed with plain hdiutil (§2).
          staging="$(mktemp -d)"
          cp -R "$APP" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "nocx" -srcfolder "$staging" -ov -format UDZO "dist/${base}.dmg"
          shasum -a 256 dist/*
          # The updater verifies the EXTRACTED bundle, not the one we
          # assembled (internal/update/platform_darwin.go:81), and the
          # signature is the thing packaging is most likely to damage —
          # assembling the bundle by hand is what dropped the signature in
          # the first place. So verify what we are about to upload, the way
          # the updater will.
          probe="$(mktemp -d)"
          ditto -x -k "dist/${base}.zip" "$probe"
          codesign --verify --deep --strict "$probe/nocx.app"
          got="$(codesign -d -r- "$probe/nocx.app/Contents/MacOS/nocx-server" 2>/dev/null)"
          [ "$got" = "$(cat build/darwin/requirement.txt)" ] || {
            echo "::error::the packaged coordinator's requirement is not the committed one: $got"; exit 1; }
          rm -rf "$probe"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*
          retention-days: 7

      # The hash file, and from this job nothing else: `macos-universal`
      # above carries no helper binaries, because the step that unpacked
      # them staged them under $RUNNER_TEMP for exactly that reason. The
      # `helpers` job's copies are the published ones; this is only this
      # job's account of what it embedded.
      - uses: actions/upload-artifact@v7
        with:
          name: embedded-hashes-macos
          path: embedded-hashes.txt
          retention-days: 7

      # The keychain outlives the job's success or failure, so its removal
      # must too. A hosted runner is discarded anyway; a self-hosted one is
      # where this line earns its keep.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

  # Build a self-contained Linux AppImage on a pinned glibc floor.
  # ubuntu-22.04 provides glibc 2.35, the baseline the support envelope
  # promises (see ADR-0007 and the Linux section in README.md).
  build-linux:
    needs: [ci, validate, helpers]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # imagemagick resizes the one committed icon master to a resolution
          # linuxdeploy accepts (see the Package AppImage step). Installed
          # rather than assumed present on the runner image, so the job does
          # not depend on something GitHub can drop.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      # The Linux job builds with plain `go build` — v3 has no build wrapper
      # without a Taskfile, which this repo does not use — so no Wails CLI is
      # needed here.
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      # The helpers are EMBEDDED in the app (//go:embed all:bin), so
      # they must exist before the Go build that embeds them. Until
      # nocx-mchgh no step put them there at all and every published
      # release answered ErrArtifactsNotBuilt for every platform: remote
      # git could not work in any release, and worked from a checkout,
      # which is why nothing reported it (Makefile:125 makes build-release
      # depend on helpers; release.yml never did).
      #
      # They are DOWNLOADED rather than built here since nocx-6de7c — see
      # the `helpers` job for why two `make helpers` runs are not two
      # copies of one binary.
      - name: Download the helpers the `helpers` job built
        uses: actions/download-artifact@v8
        with:
          name: helper-artifacts
          path: internal/helper/deploy/artifacts/bin

      # The gate, expressed as a test rather than as a file listing: a
      # build that embedded nothing answers ErrArtifactsNotBuilt for every
      # platform, and NOCX_REQUIRE_HELPER_ARTIFACTS turns the skip that
      # protects a fresh checkout into the failure a release needs.
      #
      # Since nocx-6de7c it asserts THE DOWNLOAD LANDED AND WAS EMBEDDED,
      # not that `make helpers` ran in this job — and that is exactly the
      # failure a download step can produce silently. An artefact that
      # arrives empty, or under a path //go:embed does not read, leaves a
      # build that compiles cleanly and ships an app with no helper for
      # any platform.
      - name: The built binary embeds a helper for every matrix platform
        run: NOCX_REQUIRE_HELPER_ARTIFACTS=1 go test ./internal/helper/deploy/ -run 'TestEveryMatrixPlatformResolves|TestArtifactReturnsCompressedBytesAndDecompressedHash' -count=1

      - name: Build Linux binary
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X github.com/shady2k/nocx/internal/version.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/shady2k/nocx/internal/version.Commit=${GITHUB_SHA}"
          LDFLAGS="${LDFLAGS} -X github.com/shady2k/nocx/internal/version.Date=${BUILD_DATE}"
          # `gtk3` is not optional here, it is what makes the step above
          # mean anything: Wails v3 defaults to GTK4/WebKitGTK-6.0, so a job
          # that installs libwebkit2gtk-4.1-dev and says nothing else links a
          # different webkit than the envelope promises. 4.1 is the decided
          # target — ADR-0007 and the README support envelope both name it —
          # and the tag states the decision rather than the apt line implying
          # it (nocx-xy9z, nocx-v3yw). `production` is v3's tag for
          # production semantics; `release` selects the shipped profile
          # directory (appdir.go).
          go build -tags "release production gtk3" -ldflags "$LDFLAGS" -o build/bin/nocx .
          # The coordinator, which the AppImage must carry: on Linux the
          # daemon is copied out of the image on first run and spawned from a
          # versioned path, because the image's FUSE mount goes away with the
          # process that started it (internal/update/serverbin). An AppImage
          # that does not contain it has nothing to copy.
          #
          # CGO_ENABLED=0: no GTK, no WebKit, and a static binary is one the
          # AppImage's bundled library set is irrelevant to.
          CGO_ENABLED=0 go build -tags release -ldflags "$LDFLAGS" -o build/bin/nocx-server ./cmd/nocx-server

      # WHAT THIS JOB ACTUALLY EMBEDDED, hashed and thrown away. The
      # `helpers` job is the one origin for the bytes; this file is the
      # evidence that the origin is what landed here, and `sign` holds it
      # against that job's helper-hashes.txt. A build job that quietly
      # built helpers of its own, or that received a stale artefact, is red
      # there instead of shipping an app whose embedded helper is not the
      # published one — which is the whole reason a check survives in
      # `sign` at all.
      #
      # Staged under $RUNNER_TEMP and never under dist/, because dist/* is
      # what this job uploads, and the helper binaries are published from
      # the `helpers` job alone. One file name arriving twice in one
      # download directory would let step ordering decide which bytes users
      # get.
      #
      # UNCOMPRESSED, deliberately. `make helpers` gzips, and gzip stamps
      # the source file's mtime into its header, so the .gz bytes differ
      # between runs even when the binary inside is identical — hashing
      # those would compare the wrong thing. The DECOMPRESSED bytes are
      # what internal/helper/deploy/install.go hashes to key the install
      # directory, so they are what both this comparison and the published
      # asset are about.
      #
      # The loop takes the platforms from the artifacts on disk rather
      # than from a list written here, so the matrix can grow (it goes
      # 2x2 in nocx-psjfb) without this step being edited to match.
      #
      # shasum -a 256, not sha256sum: macOS has no sha256sum, Linux has
      # both, and one spelling that works in either job is worth more
      # than the shorter one.
      - name: Hash the helper bytes this job embedded
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/helper-stage"
          mkdir -p "$stage"
          : > embedded-hashes.txt
          for gz in internal/helper/deploy/artifacts/bin/nocx-helper-*.gz; do
            name="$(basename "$gz" .gz)"          # nocx-helper-<goos>-<goarch>
            plat="${name#nocx-helper-}"
            out="$stage/nocx-helper-${VERSION}-${plat}"
            gunzip -c "$gz" > "$out"
            printf '%s %s\n' "$plat" "$(shasum -a 256 "$out" | awk '{print $1}')" >> embedded-hashes.txt
          done
          sort -o embedded-hashes.txt embedded-hashes.txt
          cat embedded-hashes.txt

      - name: Smoke checks (binary)
        run: |
          set -euo pipefail
          BIN="build/bin/nocx"
          test -x "$BIN"
          file "$BIN" | grep -q 'ELF 64-bit'
          reported="$("$BIN" --version)"
          echo "reported: $reported"
          echo "$reported" | grep -qw "$VERSION"
          # The coordinator is not run here: it takes no flags and would
          # start a daemon. Same $LDFLAGS, same step — see the macOS job's
          # smoke check for the whole of the reasoning.
          SRV="build/bin/nocx-server"
          test -x "$SRV"
          file "$SRV" | grep -q 'ELF 64-bit'
          file "$SRV" | grep -q 'statically linked'

      # The packaging itself lives in scripts/appimage/package-appimage.sh so it
      # can be run against a real build outside a tag push. Packaging that only
      # exists inside a workflow cannot be tested before it ships, and this step
      # is exactly where nocx-azxe.7 shipped from.
      - name: Package AppImage
        run: scripts/appimage/package-appimage.sh

      - name: Verify the AppImage on a foreign distribution
        run: scripts/appimage/verify-appimage.sh "dist/nocx-${VERSION}-linux-amd64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*
          retention-days: 7

      # `linux-amd64` above carries no helper binaries either: since
      # nocx-6de7c they are staged and published by the `helpers` job
      # alone. This upload is this job's account of what it embedded, for
      # the check in `sign`.
      - uses: actions/upload-artifact@v7
        with:
          name: embedded-hashes-linux
          path: embedded-hashes.txt
          retention-days: 7

  # Separate from build so the signing key is never present in a job that runs
  # build tooling (§5). Manifest work, so it runs on ubuntu.
  #
  # Deliberately NOT gated on a tag. This job holds the one check nocx-1d54
  # exists for — that RELEASE_SIGNING_KEY's public half is in the keyring the
  # artefact ships — and while it lived inside the tag-gated publish job that
  # check had never once run: every dry run reported publish "skipped" while
  # the file's own header claimed a manual run "builds, signs and verifies
  # everything and publishes nothing". The first execution would have been the
  # release (nocx-94kl).
  #
  # Only `contents: write` and `gh release create` need the tag, and they stay
  # behind it in the job below. This job keeps the workflow's read-only default.
  sign:
    needs: [validate, helpers, build-macos, build-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: dist

      # The published helper binaries, from their one origin. `sign` needs
      # them for their size in the manifest; `publish` uploads them.
      - uses: actions/download-artifact@v8
        with:
          name: helper-binaries
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: helper-hashes
          path: hashes/published

      - uses: actions/download-artifact@v8
        with:
          name: embedded-hashes-macos
          path: hashes/macos

      - uses: actions/download-artifact@v8
        with:
          name: embedded-hashes-linux
          path: hashes/linux

      - name: Both build jobs embedded the published helper bytes
        run: |
          set -euo pipefail
          # There is one origin for the helper bytes now (nocx-6de7c), so
          # this is no longer two toolchains being asked to agree — it is
          # the check that the origin is what each build job actually
          # embedded. A job that quietly built helpers of its own, or that
          # received a stale artefact from a previous run, produces an app
          # whose embedded helper is NOT the published one: a macOS-built
          # app and a Linux-built app would then deploy different binaries
          # to one host under one version, and D6's "exactly one automatic
          # reinstall" would fire on every connection, forever, silently.
          # That is the failure this step still exists to catch.
          want="hashes/published/helper-hashes.txt"
          [ -s "$want" ] || { echo "::error::the helpers job published no hash file"; exit 1; }
          for job in macos linux; do
            got="hashes/$job/embedded-hashes.txt"
            [ -s "$got" ] || { echo "::error::build-$job uploaded no embedded-hashes.txt"; exit 1; }
            if ! diff -u "$want" "$got"; then
              echo "::error::build-$job embedded helper bytes that are not the published ones"
              exit 1
            fi
          done
          echo "both build jobs embedded the bytes the helpers job published"

      - name: Generate manifest.json
        run: |
          set -euo pipefail

          # ── macOS artefact ───────────────────────────────────────────
          mac_base="nocx-${VERSION}-darwin-universal"
          mac_zip="dist/${mac_base}.zip"
          mac_sha="$(sha256sum "$mac_zip" | awk '{print $1}')"
          mac_size="$(stat -c%s "$mac_zip")"
          mac_url="https://github.com/shady2k/nocx/releases/download/v${VERSION}/${mac_base}.zip"

          # ── Linux artefact ───────────────────────────────────────────
          linux_base="nocx-${VERSION}-linux-amd64"
          linux_appimage="dist/${linux_base}.AppImage"
          linux_sha="$(sha256sum "$linux_appimage" | awk '{print $1}')"
          linux_size="$(stat -c%s "$linux_appimage")"
          linux_url="https://github.com/shady2k/nocx/releases/download/v${VERSION}/${linux_base}.AppImage"

          # ── helpers ──────────────────────────────────────────────────
          # Read from hashes/published, because THE HELPERS JOB'S BINARIES
          # ARE THE ONES PUBLISHED, and they are the only ones that exist:
          # neither build job stages a helper under dist/, so
          # dist/nocx-helper-* here came from `helper-binaries` and from
          # nowhere else. The step above has already proved both build jobs
          # embedded exactly these bytes.
          #
          # sha256 here is the content hash install.go keys the install
          # directory by (D7), so a hand-installed helper and an
          # ssh-delivered one resolve to the same directory.
          #
          # The loop is driven by the hash file, so the array is however
          # many helpers the matrix built — no count is written here.
          helpers_json="$(
            while read -r plat sha; do
              os="${plat%-*}"; arch="${plat#*-}"
              f="dist/nocx-helper-${VERSION}-${plat}"
              jq -n --arg os "$os" --arg arch "$arch" \
                --arg url "https://github.com/shady2k/nocx/releases/download/v${VERSION}/nocx-helper-${VERSION}-${plat}" \
                --arg sha "$sha" --argjson size "$(stat -c%s "$f")" \
                '{os: $os, arch: $arch, url: $url, sha256: $sha, size: $size}'
            done < hashes/published/helper-hashes.txt | jq -s .
          )"

          released="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg v "$VERSION" \
            --arg r "$released" \
            --arg notes "https://github.com/shady2k/nocx/releases/tag/v${VERSION}" \
            --arg mac_url "$mac_url" \
            --arg mac_sha "$mac_sha" \
            --argjson mac_size "$mac_size" \
            --arg linux_url "$linux_url" \
            --arg linux_sha "$linux_sha" \
            --argjson linux_size "$linux_size" \
            --argjson helpers "$helpers_json" \
            '{version: $v, released: $r, notesUrl: $notes,
              artifacts: [
                {os: "darwin", arch: "universal", format: "zip",
                 url: $mac_url, sha256: $mac_sha, size: $mac_size},
                {os: "linux", arch: "amd64", format: "AppImage",
                 url: $linux_url, sha256: $linux_sha, size: $linux_size}
              ],
              helpers: $helpers}' > dist/manifest.json
          cat dist/manifest.json

      - name: Sign manifest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/manifest-sign -in dist/manifest.json -out dist/manifest.json.sig

      # The only check that proves the two halves are a pair. Signing shows the
      # secret is present and well-formed; it says nothing about whether the
      # artefact we are about to publish can check the result. If
      # RELEASE_SIGNING_KEY and internal/update/keyring.go drift apart, every
      # step here still succeeds and every user's update check then fails
      # against a manifest no key in their build validates.
      #
      # No secret in this step: it verifies against the keyring compiled from
      # the same commit that produced the artefacts (nocx-1d54).
      - name: Verify the signature against the keyring the release ships
        run: go run ./cmd/manifest-sign -verify -in dist/manifest.json -sig dist/manifest.json.sig

      # Carried to publish rather than regenerated there: the bytes that were
      # verified above must be the bytes that get uploaded, or the verification
      # attested to a different file.
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            dist/manifest.json
            dist/manifest.json.sig
          retention-days: 7

  # The only tag-gated job, and the only one holding contents: write. It runs no
  # build tooling and no signing — it uploads what the jobs above produced.
  publish:
    needs: [validate, helpers, build-macos, build-linux, sign]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: dist

      # The four helper assets, from the one job that built them. The file
      # names are unchanged; only their origin is.
      - uses: actions/download-artifact@v8
        with:
          name: helper-binaries
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: manifest
          path: dist

      # The notes `validate` staged, when that version had any. Guarded on the
      # same output that decided whether to upload them: no artefact exists in
      # the other case, and downloading one that does not exist fails the run.
      - name: Download the release notes `validate` staged
        if: needs.validate.outputs.notes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      # GH_REPO, because this job never checks the repository out — it only
      # downloads the three artefacts above — and `gh` falls back to asking
      # git which remote it is talking about. With no .git it does not fail
      # over to the Actions context; it stops with "failed to run git: fatal:
      # not a git repository" and the release is never created (nocx-kqqh).
      #
      # A checkout would also work and is the wrong fix: this job has no use
      # for the source, and cloning it to satisfy an implicit lookup hides
      # what the lookup actually needed. Naming the repository says it.
      #
      # This step had never run before v0.1.0. `publish` is gated on
      # validate.outputs.release, which only a tag sets, so every dry run
      # skipped it — the same blind spot that once hid the keyring check
      # sitting in this very job (nocx-94kl). A step no rehearsal reaches is
      # a step that is first executed for real.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # THE NOTES ARE A FILE IN THE REPOSITORY when one exists for this
          # version, so what a release says is written, reviewed and diffed
          # like everything else that ships. It reaches this job as the
          # `release-notes` artefact `validate` staged from the checked-out
          # tree — this job has no working copy to read it from. The fallback
          # is the sentence this step used to carry alone: it is the install
          # caveat, which is true of every build and belongs in every release
          # whether or not anybody wrote notes for that one.
          notes_file="notes/notes.md"
          if [ -f "$notes_file" ]; then
            notes_arg=(--notes-file "$notes_file")
          else
            echo "::warning::no docs/release-notes/v${VERSION}.md — publishing with the install caveat alone"
            notes_arg=(--notes "Automated release. macOS: first launch needs the manual quarantine step. Linux: chmod +x the AppImage. See the README for both.")
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            "${notes_arg[@]}" \
            "dist/nocx-${VERSION}-darwin-universal.dmg" \
            "dist/nocx-${VERSION}-darwin-universal.zip" \
            "dist/nocx-${VERSION}-linux-amd64.AppImage" \
            "dist/nocx-helper-${VERSION}-linux-amd64" \
            "dist/nocx-helper-${VERSION}-linux-arm64" \
            "dist/nocx-helper-${VERSION}-darwin-amd64" \
            "dist/nocx-helper-${VERSION}-darwin-arm64" \
            "dist/manifest.json" \
            "dist/manifest.json.sig"
