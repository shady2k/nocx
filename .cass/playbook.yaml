    content: "lesson (herdr coordination, nocx 2026-08-15): in this Claude Code session ALL background waits are killed at turn boundaries — watch.py socket subscriptions AND server-side 'herdr agent wait' alike, regardless of timeout (9 min died the same as 40 min). Both mechanisms are fine; the harness reaps the background command. Waits that appeared to work were ones that completed inside a single turn while other work was in flight. Use the Monitor tool instead: it survives turn boundaries and re-invokes on each stdout line. Make the loop emit on death too (empty agent list = panes gone), because a filter matching only 'done' makes a dead worker look identical to a working one."
