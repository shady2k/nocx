  - id: b-bd-125
    content: "rule (nocx, always): the user's environment and infrastructure facts NEVER enter the repository. Not code, not comments, not commit messages, and not .internal/ briefs — .internal/ is tracked, so a brief is as public as source. Specifically forbidden: host names, machine specs (cores/RAM/disk sizes), free-space numbers, names of tooling that hosts the session, process counts, and narratives of what crashed on the user's box and why. Into code goes only the technical invariant that justifies the code — e.g. 'a full disk can break unrelated processes sharing the filesystem', never 'the host's Nx GB disk filled and the runtime died'. Into a worker brief goes the CONSTRAINT in operational form — e.g. 'concurrent Playwright runs are forbidden: the port is shared, so results would be false' — never the incident report. Caught by the user after I wrote host details into an e2e preflight comment AND into three WIP commit messages; commit messages are permanent, which makes that the worse half. Note the second-order trap: this memory itself is stored in beads, and .beads/issues.jsonl is a tracked export, so a memory that restated the private facts would commit the same leak it warns about — state the rule, never the incident."
    category: workflow
    kind: workflow_rule
    type: rule
    isNegative: false
    scope: global
    source: learned
