  - id: b-bd-011
    content: "A stop is a conversation with ONE process group; an interrupt is a question about the present moment. internal/transport/foreground_signal.go now splits foregroundJob (name the addressee) from stopProcessGroup (run INT/TERM/KILL against it). Two orderings were got wrong in one day and both were caught only downstream: (1) re-reading the foreground at every rung let the escalation walk onto a command the person started inside SignalGrace — caught by review of PR #121; (2) re-reading the lease's `done` AFTER cancel() skipped the escalation entirely, because cancel() is what ends the request and disarms the lease on another goroutine — caught by CI, green locally twice. The rule that survives: name the addressee while you still own it, then withdraw, then signal. A dead addressee answers ESRCH and that is the correct nothing-running."
