    content: "environment: не запускай npm ci в контейнере nocx-e2e:local против голого bind-mount репозитория — только через именованные тома, как это делает e2e/run-in-container.sh (-v nocx-e2e-node-$KEY:/work/node_modules и -v nocx-e2e-fenode-$KEY:/work/frontend/node_modules). Контейнер работает root, bind-mount отдаёт файлы хосту как есть, и node_modules хоста становится root-owned: rm -rf падает на Permission denied, npm ci на хосте больше не проходит, а pre-commit умирает на eslint/prettier с EACCES (та же форма, что nocx-z9s9.8, ради которой в container-entry.sh есть chown в EXIT-трапе — но он срабатывает только когда запуск идёт ЧЕРЕЗ entry-скрипт). Чинится тем же контейнером: docker run --rm -v \"$PWD:/work\" nocx-e2e:local chown -R $(id -u):$(id -g) /work/node_modules, затем rm -rf node_modules && npm ci на хосте. Измерено 2026-08-30 при отладке nocx-7jt3u: стоило круга."
