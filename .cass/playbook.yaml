    content: "nocx, wiring a notification source (or any backend handler): CHECK BOTH SIDES OF THE SEAM BEFORE CHOOSING IT. 2026-08-23 block.finished was wired at ledger.close — it compiled, its unit tests passed, deadcode was quiet, a diff review called it good, and it did nothing, because the renderer calls ledger.query/get/artifact/capture and never close; a finished command travels history.record. Cost a full round trip. The check is one grep of frontend/src for the method name, and it takes seconds. Confirmed to work: the transfer.finished source (nocx-zlxmm) was chosen only after proving settleUpload has a live caller, and it worked first time. Corollary: the ONLY check that catches a wrong seam is an e2e that drives the user's path — write it FIRST so it leads the work, not last so it confirms it."
