  - id: b-bd-012
    content: "A test that fails under load and passes in isolation will destroy a bisect: during nocx-u7uh I 'bisected' a container failure by re-running with -race -count=2, and the counts flipped per patch purely by chance — the conclusion 'worker .28 broke transport' was noise. -count=1 passed on the same tree. Before attributing a container failure to a change, re-run the SAME command shape the gate uses (default count) on both trees, and treat an exact 5.00s 'timed out waiting for <x> notification' as the known load flake (nocx-u7uh.31) rather than as evidence."
