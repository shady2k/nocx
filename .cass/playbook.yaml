  - id: b-bd-039
    content: "Headless e2e runner for nocx that works (2026-07-26), no Xvfb, no wails: (1) go run ./cmd/devharness & — it prints WSPORT=<n> and WSTOKEN=<s> on stdout; (2) cd frontend && npx vite --port 5173 --strictPort &; (3) NOCX_WS_PORT=<port> NOCX_WS_TOKEN=<token> npx playwright test e2e/<file> --project=chromium --reporter=line. PLAYWRIGHT_BROWSERS_PATH already points at the nix playwright-browsers store path in this environment and PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS is set, so no executablePath override is needed. Full run of e2e/tabs.spec.ts takes about 5s. Script kept at scratchpad/e2e-run.sh pattern: kill stale devharness/vite first, poll for WSPORT in the log, poll curl localhost:5173 before starting playwright."
