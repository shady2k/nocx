  - id: b-bd-129
    content: "Solid <For> does not untrack signal reads in the JSX its child returns — fine-grained reactivity inside <For> is normal and documented. When a list item does not update reactively, the cause is that the ITEM is a plain mutable object rather than a reactive source, not a <For> limitation. Seen 2026-07-27 on nocx-82l9.5: a worker reintroduced imperative DOM patching (walking container.children by index and querySelector-ing) inside a createEffect, justified by a made-up '<For> runs children inside untrack() + createRoot()' claim. The fix is to make the source reactive — a local createStore keyed by id inside the component. frontend/src/sidebar.tsx is the counter-example in this repo: it reads store fields inside a <For> child and updates correctly with no effect."
