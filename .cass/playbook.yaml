  - id: b-bd-034
    content: "feedback (nocx, owner, 2026-08-25): do not file beads nobody asked for. I hit an ADR-numbering oddity while rewriting a spec, filed it as a P1 bug, then started working it; the owner's answer was 'зачем заводить задачи, которые нафиг никому не нужны?'. The rule is not 'never file' — a real blocker becomes a bead in the same minute, per AGENTS.md. The rule is that a thing I noticed in passing, which blocks nothing and nobody asked about, is a sentence in the report, not a P1 in the queue. Filing it makes the queue longer and my own next 'продолжай' pick it up. Same session, three 'продолжай' in a row got read as 'find yourself work', and each step drifted further from the task actually asked for. When a task finishes, say it finished and stop."
