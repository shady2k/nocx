  - id: b-bd-020
    content: "Before filing ANY e2e flake bead on nocx, read nocx-6wgcw first — it is the umbrella bead for the unstable mixed e2e run and already names twelve specs including snippets.spec.ts:355 and secret-panel-position.spec.ts:361. It has been duplicated twice (nocx-3f1yq on 2026-09-01, nocx-mapiq on 2026-09-02), both times by an agent who went straight to 'this spec is red, file it' without running the five checks in AGENTS.md. The right move on a red e2e spec that your diff cannot explain: check nocx-6wgcw, and if it is the same phenomenon append your data point to it with --append-notes rather than opening a bead. Related same-phenomenon beads: nocx-n26p1, nocx-v9n4m, nocx-85vyg, nocx-it6m, nocx-rj81l."
