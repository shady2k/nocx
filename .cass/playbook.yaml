  - id: b-bd-098
    content: "nocx long gates: run them with setsid, NOT in a herdr pane. Measured 2026-09-03: ./scripts/ci-linux.sh started via 'herdr pane split' + 'herdr pane run' died silently ~8 minutes in — pane wS8:p2 was GONE from 'herdr pane list', docker ps empty, log frozen mid-run, no marker file. That is the already-recorded hazard 'worker panes and workspaces can be closed by ANOTHER session sharing the same herdr server' hitting the gate instead of a worker. The existing memory recommending a herdr pane was written to avoid a DIFFERENT failure — the harness killing its background task's process group along with the docker container — and setsid solves that one without inheriting the pane's fragility, because a new session escapes the group kill and depends on no pane. Working form: setsid nohup bash -c 'CMD > LOG 2>&1; echo $? > DONE' </dev/null >/dev/null 2>&1 & then poll for the DONE marker. Verify it actually started with 'docker ps' rather than by reading the log, because an empty log is also what a dead start looks like. Never read the pipeline's exit code through '| tail' — that returns tail's 0."
