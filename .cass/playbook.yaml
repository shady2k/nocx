    content: "lesson: In nocx, end-verification before push/PR MUST run the full local gate — gofumpt -l ., prettier --check (npm run format:check), and eslint (npm run lint) — not just go build/test + tsc + vitest. CI backend/frontend jobs enforce gofumpt+golangci-lint and prettier+eslint and fail FAST on format/lint (before tests/e2e). The gate lives in .githooks/ and is installed with 'git config core.hooksPath .githooks' (Makefile hooks/init); without it nothing is enforced locally (README: 'Without it nothing is enforced'). Evidence: PR #8 went red on gofumpt + prettier and then 9 eslint errors that build/test/typecheck had all passed; the clone had core.hooksPath unset. The hook is check-and-reject (no autofix) and its containerized test step needs working docker."
