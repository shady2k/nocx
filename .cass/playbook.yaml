  - id: b-bd-059
    content: "lesson (nocx backlog, 2026-08-25): an epic created from a design conversation can claim a lineage that points at a CLOSED epic. nocx-22k1c opened with 'nocx-rtg0 named this its own epic ... that epic is this one'; the epic rtg0 deferred to is nocx-2f0f, which shipped output capture on 2026-08-19 (ledger.capture, artifacts+artifact_chunks, and 2f0f.5's four retention knobs). The new epic's substance survived — 2f0f captures in the renderer at freeze time, so a detached session captures nothing — but a worker starting from it would have built a second output store. Same session found ADR-0002 misquoted in nocx-szb40.2 by splicing two Consequences bullets. Both are the same shape: a brief written from what the conversation remembered rather than from the tree, which is what AGENTS.md's five checks are for, and they gate the BRIEF. When you create epics out of a design session, grep the closed backlog for the concept before writing the lineage sentence."
