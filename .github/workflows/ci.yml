# CI — quality gates for nocx.
#
# Runner decision: back-end job runs on macos-latest because:
#   - darwin is the target platform for this macOS-first MVP (see
#     docs/architecture.md § "Operational / Environmental Envelope"), so CI
#     should build and test what ships to users;
#   - internal/pty exercises creack/pty, and PTY semantics differ between macOS
#     and Linux — those tests are only meaningful on the target OS;
#   - the repo is public, so macos-latest runner minutes are free.
#
# It is NOT pinned. ADR-0036's Seatbelt backend is deprecated and runtime-only,
# and this branch pinned macos-15 on the report that newer hosted images make
# sandbox-exec abort before its child starts. The owner reverted the pin on
# 2026-08-21: a pinned image is a gate that stops testing what ships the day
# GitHub moves, and the claim is one CI run can settle. If the Seatbelt smoke
# below goes red on macos-latest, the answer is a separate pinned job for that
# ONE step, never the whole macOS gate.
# (Note: wails/v2 also requires GTK3/WebKit2GTK on Linux; the decision stands
# on the target-OS argument alone, without measuring ubuntu.)
# Every job here has a local target of the SAME NAME that is the job, and
# `make ci-full` runs them all:
#
#   ci-mac       make ci-mac        this host, macOS — see below
#   ci-backend   make ci-backend    the portable packages, ubuntu-24.04 container
#   ci-linux     make ci-linux      the OS-specific packages, both keyring variants
#   ci-frontend  make ci-frontend   node 24, frontend/ AND the repo root
#   ci-e2e       make ci-e2e        the same image and the same command
#
# The names match on purpose, and they did not until nocx-qvtu. 9527464 added
# the five local targets and deliberately left this file's four jobs alone —
# "splitting the workflow in release week risks the release itself for no gain
# … the workflow can follow once the branch is green" — and that deferral lived
# only in a commit body, so nothing surfaced it and the owner had to ask why
# the names still disagreed. A job whose local runner has a different name is a
# gate nobody can be sure they ran.
#
# THE SPLIT, and what it deliberately gives up. ci-backend carries the
# portable packages and ci-linux the OS-specific ones; together they are ./...
# exactly, with the two sets taken FROM THE MAKEFILE rather than from a list
# copied into this file. ci-mac runs the OS set natively on Darwin — the small
# job, on purpose: a portable package proves nothing extra by being compiled
# twice, and macos-latest is the scarcest runner here.
#
# What that gives up is the portable suite on Darwin, which used to run in the
# old `backend` job. Accepted: a portable package compiled twice proves the
# second compilation, not the platform.
#
# internal/shellintegration is the package you would expect to be exempted and
# is NOT, so the reasoning is recorded rather than left to be re-argued. Its
# behaviour is the platform's shell — macOS ships GNU bash 3.2.57, where a
# bash-4 construct is a syntax error at PARSE time, and that is how every macOS
# bash came up with no integration while all of Linux stayed green (nocx-cn86).
# But the dimension there is a BASH VERSION, not an operating system:
# scripts/install-bash32.sh puts a real 3.2 on the Linux runner, requireBash32
# resolves it there and /bin/bash on a Mac, and TestBashScript_ParsesUnderBash32
# and the channel-exec bash32 leg therefore measure the same shell on either
# side. Keeping the package on macos-latest would buy the OS around the shell,
# not the shell. OS_EXEMPT in the Makefile carries only internal/pty and
# internal/storage, each with its own reason.
#
# THE DEAD-CODE RATCHET LIVES HERE NOW, one half in ci-mac and one in
# ci-linux, and it is the only gate in this file with no local target at all.
# That is deliberate twice over: it ran in the pre-commit hook and nowhere
# else, which meant it never ran on the platform a developer was not sitting
# at; and Wails v3 removed the CGO_ENABLED=0 cross-GOOS analysis that let one
# machine answer for both, so between the migration and nocx-re6gk it ran in
# no place whatsoever. A commit does not pay for it, and neither does
# `make ci-full` — a Mac cannot compute the linux answer and a Linux box
# cannot compute the darwin one, so a local composite could only ever be half
# of it and would read as the whole.
#
# `make ci` alone is the host-side half only. The Makefile used to be described
# here as mirroring "this same set of checks so green is identical locally and
# in CI"; it covered one of the four jobs, and a release attempt and its
# follow-up PR both came back red from a job the local gate had just reported
# green (2026-08-10, nocx-cn86). The claim is now a list, and each line of it is
# a command somebody can run.
#
# `ci-mac` is the one job with no container, and deliberately: macos-latest is
# the target OS. That makes it the one place where local and CI can still
# disagree — and they do (nocx-58gq, nocx-65v6). See the Makefile's `ci` target.
#
# Trigger decision: CI runs on pull requests to main, on release branches
# (release/**) and manual workflow_dispatch, and is *called* by release.yml via
# workflow_call so a tag release cannot exist without a green run on that exact
# commit. The `pull_request: [main]` trigger is the mechanical gate on main
# (nocx-q36): the local pre-commit hook and `make ci` give the same checks as
# fast feedback, but a hook is bypassable with --no-verify and `make hooks` is a
# per-clone step a fresh checkout may skip, so CI is what actually enforces "no
# merge without green". The standalone `push: tags: ['v*']` trigger stays gone:
# with release.yml calling this workflow, keeping it would run the whole suite
# twice for every release for no added protection (see distribution design §5).

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['release/**']
  workflow_dispatch:
  workflow_call:

# Least privilege: the quality gates only read the repo. When release.yml calls
# this workflow the effective token is the intersection with what the caller
# grants, so the publish job's write scope never reaches these jobs.
permissions:
  contents: read

jobs:
  ci-mac:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          UNFMT=$(gofumpt -l .)
          if [ -n "$UNFMT" ]; then
            echo "gofumpt: the following files need formatting:"
            echo "$UNFMT"
            exit 1
          fi
          echo "gofumpt: all files formatted"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run ./...

      - name: Build
        run: go build -tags gtk3 ./...

      # THE DEAD-CODE RATCHET, darwin half. It ran in the pre-commit hook and
      # nowhere else until Wails v3 took away the CGO_ENABLED=0 cross-GOOS
      # analysis the hook version was built on, at which point it ran nowhere
      # at all (nocx-re6gk). Each platform now analyses itself, natively, with
      # cgo on; .githooks/check-deadcode.mjs carries the whole argument and
      # --platform asserts this job is the runner it thinks it is.
      #
      # The baseline is the union of the two platforms, so this job sees a
      # subset of it: a NEW violation still fails, and a stale entry belonging
      # to linux simply goes unmentioned here.
      #
      # Pinned like golangci-lint and not floating like gofumpt, because the
      # checker fails loudly on an output line it cannot parse — a newer
      # deadcode changing its format would read as a broken gate rather than
      # as a tool upgrade.
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0
      - name: Dead-code ratchet (darwin)
        run: node .githooks/check-deadcode.mjs --platform=darwin/arm64

      # THE OS-SPECIFIC PACKAGES ONLY, and the list comes from the Makefile
      # (`make ci-mac` runs the same set locally, in a disposable root).
      #
      # This job used to run the whole suite here. Small is the point: a
      # portable package proves nothing extra by being compiled twice, and
      # macos-latest is the scarcest runner in this matrix. What belongs here
      # is what only Darwin can answer — PTY semantics, the profile directory,
      # the keystore binding, the socketpair — and nothing else. The header
      # explains why internal/shellintegration is not on that list even though
      # it is the package about macOS's bash.
      - name: Resolve the OS-specific package set
        id: pkgs
        run: echo "list=$(make -s print-os-pkgs)" >> "$GITHUB_OUTPUT"

      - name: The OS split has not drifted
        run: make ci-os-split

      # The three Seatbelt process-boundary tests skip in this race-instrumented
      # invocation: macOS TSan aborts before Go main once sandbox-exec applies a
      # deny-default profile. The immediately following non-race smoke runs those
      # exact process tests against the production-shaped runtime.
      - name: Test (the OS-specific packages)
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        run: go test -race -tags gtk3 -count=1 $PKGS

      # Seatbelt is deprecated and runtime-only; compiling the Darwin backend
      # proves neither profile acceptance nor enforcement. This non-race gate is
      # also the executable counterpart to the TSan skips above.
      - name: Sandbox enforcement smoke (Seatbelt)
        run: make sandbox-smoke-macos

      # Keep the next Seatbelt failure actionable. Reports contain only this
      # disposable runner's process/path metadata; no user data or secrets.
      - name: Seatbelt denial diagnostics
        if: failure()
        run: |
          log show --last 2m --style compact --info --debug \
            --predicate 'eventMessage CONTAINS[c] "Sandbox:"' || true

      # The shipped profile directory lives behind `-tags release`
      # (internal/storage/appdir.go), so the ordinary run never compiles it. One
      # package, one assertion — but without it a typo there ships an app that
      # cannot find any existing installation's documents.
      - name: Test (release build tag)
        run: go test -race -count=1 -tags release ./internal/storage/...

  # ci-backend — the PORTABLE half of the Go suite on Linux, with and without a
  # Secret Service. Its OS-specific half is ci-linux, immediately below.
  #
  # Runner decision: ubuntu-latest is the standard CI Linux image. The macOS
  # ci-mac job tests the target OS; this job tests Linux behaviour, which
  # matters because go-keyring's back end is platform-specific and the
  # release pipeline ships a linux/amd64 AppImage.
  #
  # Matrix decision: two variants (a Secret Service, or none) in one job
  # rather than two separate jobs. Rationale: common steps (checkout,
  # setup-go, build) appear once; GitHub auto-labels each variant; one job
  # ID for required checks.
  #
  # fail-fast is off for the reason these two variants exist at all: they are a
  # comparison. The question a red run has to answer is WHICH of "with a Secret
  # Service" and "without one" broke, and the default would cancel the survivor
  # the moment the first one failed — leaving exactly one of the two readings
  # the job was built to take.
  ci-backend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The VALUE is what GitHub prints beside the job name, so it has to say
        # what the variant IS: `ci-backend (true)` named the axis nowhere and
        # sent every reader to this file to find out which one was which.
        # Strings, not booleans.
        keyring: [with-secret-service, no-secret-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The shells internal/shellintegration drives. That package is portable Go,
      # so it rides here rather than with the OS split — and the bash VERSION it
      # must survive is provisioned below rather than borrowed from a Mac. The
      # launcher tests fail rather than skip when the shell they exist to prove
      # is missing (nocx-gd84), and a skip there would hide the riskiest paths
      # in the package. macOS was given dash because it ships zsh; ubuntu is the
      # mirror image — it ships dash and no zsh — and never got the treatment,
      # so five zsh launcher tests were failing on main (nocx-bbkh).
      - name: Install zsh (shell integration tests)
        run: scripts/install-zsh-ci.sh

      # The third shell this job must carry, and the only one that is not a
      # shell anybody here runs: macOS's /bin/bash is GNU bash 3.2.57, and the
      # integration script has to PARSE there. A bash-4 construct is rejected
      # while the file is being read, so no runtime version guard inside it
      # can help — which is how every macOS shell came up with no integration
      # while all of Linux stayed green (nocx-cn86). The macOS job proves the
      # behaviour against a real 3.2; this makes the parse check run on the
      # side that a Linux developer and this job can both see.

      # The Wails v3 module compiles cgo against WebKitGTK; the gtk3 tag
      # selects the 4.1 surface this product ships (ADR-0007). The portable
      # set includes internal/notify/wailsadapter, so the libraries and the
      # tag are required to compile at all.
      - name: Install WebKitGTK build dependencies
        run: sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install bash 3.2 (macOS's /bin/bash)
        run: sudo scripts/install-bash32.sh

      - name: Install Secret Service & dbus-x11
        if: matrix.keyring == 'with-secret-service'
        run: sudo apt-get install -y -qq gnome-keyring dbus-x11
      - name: Build
        run: go build -tags gtk3 ./...

      # THE PACKAGE SET COMES FROM THE MAKEFILE, never from a list written
      # here. `make ci-backend` and `make ci-linux` run these same two sets
      # locally, and a list written twice is two lists: the day one grows a
      # package the other does not, that package runs nowhere or twice while
      # both files still read as correct. `make ci-os-split` is the check that
      # the split itself has not drifted from the build constraints (AD-8).
      - name: Resolve the portable package set
        id: pkgs
        run: echo "list=$(make -s print-portable-pkgs | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: The OS split has not drifted
        run: make ci-os-split
      # Real Landlock enforcement smoke (ADR-0036 §8). The release gate that
      # proves the cage behaves on Linux; it fails loudly when the runner's
      # kernel is below Landlock ABI 3 — a runner that cannot run it must be
      # replaced, never silently skipped.
      - name: Sandbox enforcement smoke (Landlock)
        run: make sandbox-smoke-linux

      - name: Test (with Secret Service)
        if: matrix.keyring == 'with-secret-service'
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        run: |
          dbus-run-session -- bash <<'TESTEOF'
          set -euo pipefail
          echo "=== Starting gnome-keyring-daemon ==="
          eval "$(echo -n "nocx-ci" | gnome-keyring-daemon --daemonize --login)"
          echo "=== Unlocking login keyring ==="
          echo -n "nocx-ci" | gnome-keyring-daemon --unlock
          echo "=== Running tests ==="
          go test -race -tags gtk3 -count=1 $PKGS
          TESTEOF

      - name: Test (no Secret Service)
        if: matrix.keyring == 'no-secret-service'
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        run: go test -race -tags gtk3 -count=1 $PKGS

  # ci-linux — the OS-SPECIFIC half of the Go suite on Linux.
  #
  # Together with ci-backend this covers ./... exactly: nothing dropped,
  # nothing run twice, and `make ci-os-split` (run by both jobs) is what keeps
  # that true as packages grow build constraints. The point of two jobs rather
  # than one is attribution — a red run says whether portable behaviour broke
  # or platform behaviour did, which the single backend-linux job it replaces
  # could never say (nocx-qvtu).
  #
  # None of the shell provisioning ci-backend carries appears here, and that is
  # not an oversight: zsh, dash and bash 3.2 exist for internal/shellintegration,
  # whose source is portable and which therefore rides with ci-backend. What
  # this half does need is the Secret Service, for internal/vault/system and
  # internal/contentkey — so the keyring matrix stays, on both jobs. The matrix
  # is a FIXTURE dimension that crosses the platform split rather than being
  # part of it: portable packages read through the keystore binding too.
  ci-linux:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The VALUE is what GitHub prints beside the job name, so it has to say
        # what the variant IS: `ci-backend (true)` named the axis nowhere and
        # sent every reader to this file to find out which one was which.
        # Strings, not booleans.
        keyring: [with-secret-service, no-secret-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Install Secret Service & dbus-x11
        if: matrix.keyring == 'with-secret-service'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11

      # internal/pty is in the OS-specific set and opens a real login+interactive
      # zsh (TestClose_EndsAnInteractiveShell) to prove a closed tab leaks no
      # process. It hard-fails when zsh is absent, because a skip there reports
      # the leak as a pass. The step was in ci-backend when that job was the
      # whole Go suite; the split left internal/pty here without it.
      - name: Install zsh (internal/pty closes a real interactive shell)
        run: scripts/install-zsh-ci.sh

      # The Wails v3 module compiles cgo against WebKitGTK; the gtk3 tag
      # selects the 4.1 surface this product ships (ADR-0007). `go build ./...`
      # below compiles the whole tree including the adapter.
      - name: Install WebKitGTK build dependencies
        run: sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Resolve the OS-specific package set
        id: pkgs
        run: echo "list=$(make -s print-os-pkgs)" >> "$GITHUB_OUTPUT"

      - name: The OS split has not drifted
        run: make ci-os-split

      - name: Build
        run: go build -tags gtk3 ./...

      # THE DEAD-CODE RATCHET, linux half — the darwin half is in ci-mac, and
      # the comment there carries the argument for why there are two.
      #
      # ONE MATRIX LEG, and not because it would be slow twice (it is four
      # seconds). deadcode is static analysis of the module: the keyring axis
      # is a runtime FIXTURE dimension, so both legs would compute a byte-
      # identical answer and a red gate would print itself twice with no way
      # to tell the two reports apart. no-secret-service is the leg that needs
      # no dbus, so it is the one that carries it.
      #
      # This job rather than ci-backend: the two partition the TEST package
      # set, while deadcode analyses ./... whole and belongs to neither half.
      # It goes with the job whose name says which platform is being analysed.
      - name: Install deadcode
        if: matrix.keyring == 'no-secret-service'
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0
      - name: Dead-code ratchet (linux)
        if: matrix.keyring == 'no-secret-service'
        run: node .githooks/check-deadcode.mjs --platform=linux/amd64

      - name: Test (with Secret Service)
        if: matrix.keyring == 'with-secret-service'
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        run: |
          dbus-run-session -- bash <<'TESTEOF'
          set -euo pipefail
          echo "=== Starting gnome-keyring-daemon ==="
          eval "$(echo -n "nocx-ci" | gnome-keyring-daemon --daemonize --login)"
          echo "=== Unlocking login keyring ==="
          echo -n "nocx-ci" | gnome-keyring-daemon --unlock
          echo "=== Running tests ==="
          go test -race -tags gtk3 -count=1 $PKGS
          TESTEOF

      - name: Test (no Secret Service)
        if: matrix.keyring == 'no-secret-service'
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        run: go test -race -tags gtk3 -count=1 $PKGS

  ci-frontend:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The e2e suite is TypeScript too, and nothing was checking it. Two specs
      # were dead on their first line for as long as anyone can measure —
      # history-persistence imported a type harness.ts had stopped exporting,
      # tabby-import read a field off a shape that had none — and both are
      # compile errors that ran anyway, because the runner strips types rather
      # than checking them. They surfaced as "argument must be of type string.
      # Received undefined" from inside node:path, and only once CI began
      # building the devharness those specs need (nocx-azxe.2).
      - name: Typecheck the e2e suite
        working-directory: .
        run: |
          npm ci
          npm run typecheck

      # The root lint and format, which until now ran ONLY in the pre-commit
      # hook — and had not actually run there for some time. `eslint .` and
      # `prettier --check .` walk the filesystem, and the e2e container leaves
      # its disposable home root-owned, so both died on EACCES while expanding
      # the directory, before examining a file. A crashing gate reports nothing,
      # so nothing was reported: 19 lint errors and 15 unformatted files had
      # accumulated behind it. The steps above check `frontend/`, which is a
      # different eslint config and a different tree — it never covered this one
      # (nocx-z9s9.8).
      - name: Lint the repo root (e2e, hooks, config)
        working-directory: .
        run: npm run lint
      - name: Check formatting at the repo root
        working-directory: .
        run: npm run format:check

      # The coverage receipt: every *.spec.ts on disk is collected by some
      # project. A hand-written exclusion list cannot report a file that is on
      # neither list, which is how seven specs once ran nowhere while the
      # shards stayed green (nocx-azxe.2).
      - name: Every spec file is collected
        working-directory: .
        run: node e2e/check-coverage.mjs

  # e2e — the suite, in the same container a developer runs it in.
  #
  # ONE command: `e2e/run-in-container.sh`. Inside it, `npx playwright test`; the
  # stand it drives — cmd/devharness on a real PTY plus vite serving the renderer
  # — is Playwright's own (e2e/stand.ts). e2e/check-coverage.mjs is the receipt
  # that no spec file is uncollected, and it runs in the frontend job.
  #
  # Runner decision: the container, on ubuntu-latest — and the point is the
  # container, not the runner. This job used to be macos-latest on the argument
  # that macOS is what ships. What that produced was two stands wearing one name:
  # a developer ran Linux/bash in the container and CI ran a macOS runner with
  # whatever shell it had, and no command existed that predicted the other.
  # Measured on 2026-08-07 at the same tree: the container reported 5 failures
  # and macOS 18, the two sets overlapping in ONE test. Four macOS failures could
  # not be reproduced locally at all, and two container failures were green on
  # macOS. A gate nobody can reproduce is not a gate.
  #
  # The image is what makes the two runs identical — not the OS. It pins the
  # Playwright build, both browser builds, Go and the three shells the launcher
  # tests drive. Running "ubuntu-latest plus npm ci" instead would move the
  # divergence rather than remove it.
  #
  # What this gives up, checked rather than assumed: Darwin PTY semantics and
  # Darwin paths are covered by `ci-mac` on macos-latest (internal/pty,
  # internal/storage, including the -tags release build), and both macOS shells
  # by its 31 bash and 14 zsh tests in internal/shellintegration. WKWebView was
  # never covered here on either runner — Playwright drives its own browser
  # builds at a URL, never the app's webview. What is genuinely left uncovered is
  # the whole stack end to end on Darwin, whose one known instance is nocx-qduc,
  # already filed at P0. A macOS e2e job comes back when there is something for
  # it to prove that these do not (nocx-z9s9.8).
  #
  # No shards, and workers stays at 1 until each worker can be given its own
  # backend and home — the DocumentStore consumers rewrite whole documents, so
  # concurrency without that is a race (nocx-8rda).
  ci-e2e:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # ONE JOB PER BROWSER, and the split is about wall clock, not coverage:
    # both projects still run, they run at the same time. The suite is 314
    # tests on ONE worker (playwright.config.ts explains why one: the default
    # must assume the process is not alone on the machine), which measured
    # 21 minutes of test time inside a 23-minute job — and half of it is the
    # second browser repeating the first browser's walk.
    #
    # Splitting by PROJECT rather than raising the worker count is the safe
    # half of the same idea. The stand is one devharness plus one vite per
    # run, and specs share it: two workers would put two browsers on one
    # backend, one profile store and one settings document, which is a
    # different bug hunt. Two runners each bring up their own stand and
    # cannot see each other at all.
    #
    # `matrix.project` is the name playwright.config.ts resolves through
    # PW_PROJECTS, so the local runner is unchanged: e2e/run-in-container.sh
    # with no variable still runs both, exactly as this job did before.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7

      # Nothing else. No setup-go, no setup-node, no `playwright install`: every
      # one of those would provision a second copy of something the image
      # already pins, and the copy is where drift starts. A runner that needs
      # provisioning for this job is a sign the image stopped being the whole
      # answer.
      - name: e2e (container)
        run: e2e/run-in-container.sh
        env:
          PW_PROJECTS: ${{ matrix.project }}

      # Named per project: two jobs uploading one name is a collision, and
      # the trace you want is the one from the browser that failed.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7
