    content: "Слияние веток агентских worktree в nocx: пробное слияние делай в ОТДЕЛЬНОМ дереве (git worktree add -b trial/... /tmp/... origin/main), а не в рабочем. Две вещи, которые там ждут. Первая: pre-commit хук умирает на отсутствующем frontend/node_modules и печатает FAIL, из-за чего блокируется КОММИТ СЛИЯНИЯ, хотя само слияние прошло чисто — не читай это как конфликт, посмотри git status. Лечится одним npm --prefix frontend ci в интеграционном дереве, который всё равно нужен для contracts:check и make ci-full. Вторая: git diff --stat main..HEAD в worktree воркера ЛЖЁТ, если main успел уйти вперёд из другой сессии — покажет чужие изменения как удаления. Считай диф от SHA точки ветвления, а не от подвижного main."
