  - id: b-bd-023
    content: "Concurrent workers in ONE worktree collide on /tmp scratch filenames, not just on the git index. Measured 2026-09-03: a worker composing a commit message fell back to /tmp/msg.txt, which another worker in the same worktree had already written, and the commit landed carrying the OTHER worker's subject line. Caught and amended by the worker itself (message only, tree untouched, nothing pushed). The index discipline everyone remembers — stage files by name, never 'git add -A' — does not cover this, because nothing about it involves git. Brief workers to put message files and any scratch under the session scratchpad directory, never a fixed /tmp path. Related and already known: two workers staging at once collide in the index, so at most one worker per wave may commit."
