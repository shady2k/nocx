  - id: b-bd-006
    content: "A flaky Go test in this repo is almost always a wait on a MOMENT rather than on an observable, and four times out of nine the correct wait already existed in the same file or package — so grep for it before writing one. Instances cleared 2026-08-27: waitForConns had its reason spelled out twenty lines above the test that lacked it (nocx-vhxtn); readLifecycleWhere carried a paragraph about this exact class for the neighbouring axis (nocx-josaw); awaitSubscriber had been used by openSessionOnConn since nocx-2h08 while the sibling opener never called it (nocx-1s8re). Two more shapes worth knowing: a fixture that builds TWO repositories and DeepEquals a commit hash straddles a second boundary under load (nocx-8j7b5), and a readiness marker printed by an INTERMEDIATE shell proves strictly less than one printed by the process the signal will reach - dash catches SIGINT and drops it in that window, so kill(2) succeeds, session.signal answers delivered, and nothing dies (nocx-sf4kx). Diagnostic that pays for itself every time: a failure that eats its whole window to two decimal places is a LOST event, not a starved one; a starved machine produces late arrivals, not none."
