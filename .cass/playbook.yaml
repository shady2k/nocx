  - id: b-bd-097
    content: "nocx keychain on macOS, MEASURED 2026-08-28 and it corrects what nocx-o4hg and AGENTS.md used to say: our binary NEVER enters a keychain ACL, because zalando/go-keyring shells out to /usr/bin/security (keyring_darwin.go) — so the process asking is Apple's signed binary and re-signing a dev build cannot produce a prompt. The real cause: HOME DOES move the login keychain (security resolves it under $HOME/Library/Keychains); a READ under a HOME with no keychain fails SILENTLY, and a WRITE raises 'Keychain not found'. internal/vault/system's Probe opens with a write, so every backend start under a disposable HOME was one modal. Corollary that outlives the bug: HOME isolation covers DIRECTORIES and can never cover a per-user OS service — keychain, Secret Service, launchd agent, D-Bus. The fix is DECLARATION, not isolation: the stance is stated before anything is built (design D10), never discovered by writing."
