  - id: b-bd-077
    content: "lesson (nocx, seam refactors + e2e): moving the 'active' class on a tab pane from the shell to the TabContent seam passed 544 unit tests and all 20 chromium e2e specs, and broke one webkit spec — the settings surface rendered its rail with no content column. Mechanism worth remembering beyond this bug: TabManager.activate() calls setActive() BEFORE start(), and a content that only learns its target inside mount() cannot apply visibility until mount resolves, so mount() and the first viewportChanged both measure a pane that is not visible. A hidden pane measures ~0 width in WebKit and non-zero in Chromium (style.css keeps inactive panes laid out and hides them with visibility), so the zero-width path is webkit-only; settings then falls under its 640px narrow breakpoint and drops the content column. Two durable rules: (1) visibility must be applied before anything measures geometry — the repo already had a B.5 unit case named 'hidden tab is not sent a misleading zero rectangle', which is the same hazard from the other direction; (2) an end-state assertion ('the pane ends visible') is not an ordering assertion and will pass while this class of regression ships — assert the call ORDER with a recording TabContent. Also: this is the concrete payoff of keeping the webkit project in playwright.config.ts, alongside nocx-q18's glyph corruption."
