  - id: b-bd-022
    content: "concurrency: in Go, a select with two ready cases picks one AT RANDOM, so the wake path must never decide the answer — derive it from state afterwards. nocx-4c5d7: internal/ssh raced c.done against c.closed in one select and classifyExecError ordered them the other way round, while Exec's own header said closed must win; closing a lease releases the pooled reference that shuts the transport, so both are true a moment apart on the ORDINARY path and the loss is a consequence of the close. Fix: one leaseErr() owner every path reads. Reproduce this class with -race -count=300; GOMAXPROCS=1 hides it."
