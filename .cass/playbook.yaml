  - id: b-bd-017
    content: "bd резолвит корень проекта по расположению базы, а не по cwd: в git worktree базы нет (.beads/embeddeddolt/ только в главном клоне), поэтому 'bd config get export.*' в worktree читает /home/dev/repos/nocx/.beads/config.yaml — конфиг с main, а не из вашей ветки. Измерено 2026-08-29 на nocx-5xgrn.2: ветка уже содержала export.git-add: false, bd config get отвечал true, и оба были правы. Следствие: НИКОГДА не проверяйте изменение .beads/config.yaml через 'bd config get' из worktree — это проверка чужого файла. Проверяйте содержимое самого файла; значение вступит в силу при мерже. Тот же корень объясняет, почему все worktree делят одну Dolt-базу и один .dolt/noms/LOCK."
