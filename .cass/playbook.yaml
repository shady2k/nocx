  - id: b-bd-067
    content: "lesson (nocx frontend gates): run 'npm run typecheck' in frontend/, never a bare 'tsc --noEmit'. The script is 'tsc --noEmit -p tsconfig.json && tsc --noEmit -p tsconfig.test.json' — TWO projects, and the second is the one covering *.test.ts. A bare tsc checks only the first, reports clean, and the pre-commit hook then fails on the very specs you just wrote. Also: golangci-lint takes a GLOBAL lock, so never run it alongside a commit in the same tree — the hook's own run dies with 'parallel golangci-lint is running' and the commit fails for a reason that has nothing to do with the code."
