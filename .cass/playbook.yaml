  - id: b-bd-073
    content: "lesson (nocx, merging main into a long branch): the gate that catches an unwired feature is the DEADCODE RATCHET, and 'make ci-full' does not run it. 'node .githooks/check-deadcode.mjs --platform=linux/amd64' is a step in ci.yml only (backend + ci-linux jobs); grep -n deadcode scripts/ci-linux.sh Makefile returns nothing. The sole local runner is the pre-commit hook, so any --no-verify commit skips it. Evidence 2026-08-25: a full local make ci-full plus containerized ci-linux and ci-frontend were all green on feat/ai-assistant, and CI then failed ci-linux(no-secret-service) AND ci-mac on one line — NEW: internal/agenttools/screen_reader.go: NewScreenReader — the leftover of a tool that had been replaced. Run the ratchet by hand before pushing a merge. See nocx-hf346."
