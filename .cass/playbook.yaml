  - id: b-bd-057
    content: "lesson (nocx, 2026-07-28): renaming a class a component renders rots every e2e spec that names it, and the rot is invisible because the specs that were updated are the specs that got run. T17 renamed .tab -> .nocx-tab and updated three specs; thirteen were left, and the epic's verification ran two of the three. A Playwright locator matching nothing does not report 'the class moved', it reports 'the element is not there' — vertical-tab-placement failed its beforeEach on .tab-title and read like a broken vertical strip. Before claiming a UI epic is green, grep the WHOLE e2e suite for the old names and run the whole suite in both engines, not the specs you touched."
