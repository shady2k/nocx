  - id: b-bd-015
    content: "An 'internal/app' test failure needs three questions before it means anything, and each was bought separately: (1) was the run LOADED — a full module run under -race on a busy host fails internal/app and internal/shellintegration that are green alone in the same image, both keyring variants; (2) was it in the CONTAINER — scripts/ci-linux.sh is the real Linux gate and CI is the source of truth; (3) was it the /bin/bash FOUR — this NixOS host has no /bin/bash, so tests that fork it fail here and pass in the container. Assembled 2026-08-28 from two sessions' findings on the same evening: one had the loaded-run half, the other the NixOS half, and neither alone would have stopped a wasted capture. Run the named package alone, in the container, before believing any internal/app red."
