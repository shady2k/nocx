    content: "reference (nocx pre-commit gates, read from .githooks/pre-commit 2026-08-15): ALWAYS — gofumpt -l . / golangci-lint run ./... / npm run format:check (prettier, ROOT config, covers files outside frontend/) / npm run lint (eslint, ROOT). GO CHANGES ALSO — node .githooks/check-deadcode.mjs (ratchet: any NEW unreachable function fails the commit) / node .githooks/check-control-goroutines.mjs / go test -race, which the hook runs IN A CONTAINER. FRONTEND CHANGES ALSO — cd frontend && npm run lint / contracts:check / typecheck, plus vitest in a container. E2E CHANGES — npm run typecheck at root. Then beads export. Two traps: contracts:check exists ONLY in frontend/package.json, never at the root; and the deadcode ratchet fails on a helper you wrote but never wired, so reach it from production or delete it. Paste this list into every worker brief verbatim — naming 'go vet' instead of golangci-lint cost three worker round-trips in one wave."
