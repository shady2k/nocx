  - id: b-bd-092
    content: "nocx e2e blind spot, proven empirically 2026-07-26 by reverting the fix and re-running: the d3q-era test 'switching placement repositions the strip without a restart' (e2e/tabs.spec.ts:120) PASSES against the broken code. That is why epic nocx-d3q closed with 34 green e2e while vertical tab placement was completely broken in the product. The test asserted that the strip MOVED, never that tabs were VISIBLE — and the bug was CSS clipping (.tabbar height:38px overflow:hidden survived the swap and clipped vertical tabs to zero height). Lesson for any UI e2e here: an assertion on structure/position/class cannot catch a layout-visibility failure. Assert boundingBox dimensions and toBeVisible(). Measured proof: with the fix 7/7 pass; with tabs.ts reverted the two new live-swap tests fail while the old repositioning test and the new cold-start test both still pass."
