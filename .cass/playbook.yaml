  - id: b-bd-040
    content: "Headless nocx e2e without wails/display (NixOS): frontend main.ts falls back to WS port when GetWSPort throws; WSServer disables origin check. So run backend headless via a tiny cmd/devharness (app.New()+Start, prints WSPORT) + 'npx vite' for the frontend, then Playwright with executablePath=nix chromium (nix-shell -p chromium; the bundled ms-playwright browsers are dynamically-linked and fail on NixOS) and page.addInitScript to shim window.go.main.WailsApp.GetWSPort to the devharness port. e2e/command-editor.spec.ts beforeEach does this shim when NOCX_WS_PORT is set (no-op under real wails dev). Lets you reproduce+verify the DOM editor headless."
