  - id: b-bd-116
    content: "process (nocx, integration): merge origin/main into the feature branch BEFORE running the gate, not after. 2026-09-01, the skills epic: make ci-full and the containerized backend-linux job went red with five deterministic TestRunLease_* failures. Bisecting whose they were cost six container runs (~40 min) and ended at Task 0, which touches only internal/agenttools — they were never ours. main had already fixed them (50e4d107 'the run-lease tests stop letting the terminal margin decide', 3056116d the output-budget streaming fix). The attribution question was worthless: the action is the same either way, and it is 'merge main'. Merging first also surfaces the real integration work at the moment you can still hand it to a worker with context — here upstream had changed Declaration.Effect from one effect to a SET, which our approval rule depended on. AGENTS.md says the gate runs on the merged tree; read 'merged' as including current main."
