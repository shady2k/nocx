  - id: b-bd-056
    content: "lesson: `make ci`'s host-side test-ci cannot pass on this NixOS dev machine, and the divergence is WIDER than AGENTS.md's nocx-58gq/nocx-65v6 note. Measured 2026-08-25: 26 --- FAIL across internal/app and internal/shellintegration, 23 of them literally 'no /bin/bash', 'no GNU bash 3.2 found' or 'dash is required and missing from PATH' (there is no /bin/bash; dash is absent; bash is /run/current-system/sw/bin/bash). Reproduced IDENTICALLY on main at 6847d257 in an untouched tree, which is the check to run before believing a local backend red: 'go test -tags gtk3 ./internal/shellintegration/... ./internal/app/...' on main. The containerized jobs install the bash-3.2 fixture, so ./scripts/ci-linux.sh covers these and is the run that counts."
