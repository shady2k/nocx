  - id: b-bd-058
    content: "lesson (nocx, 2026-08-25): the e2e container's known-red set is FIVE specs, not three. Under chromium it is nocxify-journey:341, ports-row-width:307, shell-mode:145; under Linux WebKit at the container viewport those three PLUS git-panel:539 (a filter that matches nothing) and grid-width:24. Measured on feat/ai-assistant at f7a31ba2: local container 409 passed / 9 skipped / 8 failed = exactly that set, while the SAME commit was green on all eight CI jobs including both ci-e2e browsers. So a container run whose only failures are those five is a PASS; anything else is real. This corrects the earlier three-spec memory, which was measured under chromium only."
