    content: "lesson (backlog search): 'already filed?' fails when the existing bead uses a different word for the concept. A snippets brainstorm searched snippet/prompt/notes/markdown/editor, found nothing, produced a spec, a stress test and a 13-task plan — and the feature was already filed as nocx-4ff.24 'Workflows: saved parameterized commands with named args', three weeks earlier. It surfaced only when the epic's blocking edges were checked against the blockers' remaining CHILDREN. Two cheap habits that would have caught it: list the open children of every in-flight epic whose area you are entering, and search by what the thing DOES ('saved command', 'template', 'named args', 'reusable text') rather than by the name you have chosen for it."
