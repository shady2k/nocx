  - id: b-bd-008
    content: "A pane-snapshot regex watch matches STALE scrollback, not just new output. herdr watch.py reads the pane snapshot, so once a worker has printed WORKER_DONE::<id> in an earlier round, every later watch on that same regex fires instantly and reports a completion that already happened. This is distinct from (and additional to) the documented trap of the sentinel echoing from your own prompt text. Two fixes that work: make the sentinel unique per round, or watch a signal the scrollback cannot contain — a new commit on the branch, or a result file appearing. Commit-count polling in a background until-loop proved reliable in nocx worker waves."
