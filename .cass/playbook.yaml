  - id: b-bd-120
    content: "reference (nocx, macOS notifications): wails/v2@v2.13.0 ALREADY implements modern desktop notifications — pkg/runtime/notifications.go gives InitializeNotifications, RequestNotificationAuthorization, CheckNotificationAuthorization, IsNotificationAvailable, SendNotification (opts.Data payload), SendNotificationWithActions + RegisterNotificationCategory, OnNotificationResponse (click/action callback), Remove{Pending,Delivered}Notification. Underneath, internal/frontend/desktop/darwin/WailsContext.m imports <UserNotifications/UserNotifications.h>, sets a UNUserNotificationCenterDelegate, calls requestAuthorization with Alert|Sound|Badge and getNotificationSettingsWithCompletionHandler — the modern API, not deprecated NSUserNotification. The hard requirement is a BUNDLE IDENTIFIER, not a Developer ID: Wails returns 'notifications require a valid bundle identifier' and ad-hoc signing suffices, so ADR-0003 (no Developer ID, ever) does NOT block notifications. go-toast/v2 in go.mod is indirect because it IS Wails' Windows notification backend; Linux is D-Bus (hence CleanupNotifications). TRAP: pkg/mac/notification_darwin.go mac.ShowNotification is the OLD osascript path shipped in the same module — no auth check, no click callback, and it fmt.Sprintf's the message straight into an AppleScript string literal, so a body containing a double quote is an injection. Use runtime.SendNotification, never mac.ShowNotification. Also: build/darwin/Info.plist and Info.dev.plist both carry the template default com.wails.{{safeBundleID .Name}}, so dev and release are ONE identity to macOS — notification permission does not follow the nocx/nocx-dev appdir split, and renaming the bundle id later resets everyone's permission."
