  - id: b-bd-137
    content: "CORRECTED 2026-09-02. The earlier version of this memory said these specs fail ONLY in the local container and are green on CI. That is wrong: ci-e2e (webkit) failed on CI itself the same day (PR #172, run 33614386740, snippets.spec.ts:355 plus git-remote.spec.ts:248), and the same commit rerun with no change passed. So the phenomenon is instability, not a container-versus-CI difference, and it reaches GitHub's runners.\n\nDo not file a bead for it — nocx-6wgcw is the umbrella and already names twelve affected specs; append your data point there. Do not investigate it as a regression when your diff touches no frontend runtime or e2e code, but do NOT conclude 'CI will be green' either: rerun the failed job, and if it passes, that IS the evidence it was a flake. Two runs of one commit disagreeing is what proves it."
