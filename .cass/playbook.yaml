  - id: b-bd-007
    content: "A git worktree inherits core.hooksPath from the main clone, so commits made in a worktree run the OTHER checkout's hooks. On nocx this bit hard: the main clone sits on main, whose .githooks/pre-commit predates the Wails v3 migration and runs golangci-lint without --build-tags=gtk3 — so every commit from the feat/workspaces worktree failed on 'no export data for wails/v3/internal/assetserver/webview', which reads as a broken environment and is not. Fix per worktree, never repo-wide: git config extensions.worktreeConfig true && git config --worktree core.hooksPath $(pwd)/.githooks. Repo-wide would push this branch's newer hook onto the main clone, where its deadcode baseline does not exist."
