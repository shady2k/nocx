  - id: b-bd-114
    content: "Ошибка Playwright 'did not expect test.describe() to be called here' + подсказка 'you have two different versions of @playwright/test' почти НИКОГДА не про версии. У нас версии совпадали (1.61.1 везде), дублей в node_modules не было вообще. Причина: .mcp.json запускал 'npx playwright run-test-mcp-server' ДО того как @playwright/test был установлен локально -> npx молча скачал playwright в кэш ~/.npm/_npx/HASH/ и поднял сервер оттуда. Тот кэш содержит playwright, но НЕ содержит @playwright/test. Долгоживущий процесс сервера остался на копии из кэша; после локальной установки import в спеке стал резолвиться в копию проекта. Два разных инстанса ОДНОЙ версии -> runner выставляет _currentSuite в своём инстансе, а test.describe() вызывается на чужом. ДИАГНОСТИКА (самое быстрое): 'ps -o pid,ppid,lstart,command -p $(pgrep -d, -f run-test-mcp-server)' — сразу видно два процесса из ДВУХ РАЗНЫХ путей, залипший из _npx/ и живой из node_modules/. Второй источник правды: require stack в логах MCP (~/Library/Caches/claude-cli-nodejs/PROJ/mcp-logs-SERVER/), там виден путь _npx/ у loaderProcessEntry.js. Лечится рестартом сервера + убить залипший процесс; чтобы не повторялось — 'npx --no-install' в .mcp.json, тогда npx падает громко вместо тихой подмены копии. Тот же класс, что и nocx-ao7: свой код/окружение проверять ДО чужих библиотек."
