  - id: b-bd-111
    content: "orca orchestration worker-start reports state=ready, stage=input_accepted BEFORE the brief has actually been entered into the agent. The brief may sit unsent in the composer as '[Paste #1, +N lines]', or the terminal may still be on the agent's splash screen. worker-start's own report is not evidence the worker started.\n\nAlways confirm by reading the terminal, then finish the handoff explicitly:\n  orca orchestration dispatch --run <run> --task <task> --to <term> --inject\n  orca terminal send --terminal <term> --enter\n  orca terminal read --terminal <term> --limit 6   # must show the agent working\n\nCost when skipped: three workers idled on a splash screen while the coordinator believed they were implementing; the owner noticed before the coordinator did (2026-08-07)."
