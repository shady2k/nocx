  - id: b-bd-128
    content: "Run frontend vitest with the frontend project as its root, or the environment is wrong and tests fail for a reason that has nothing to do with the code. 'cd frontend && ./node_modules/.bin/vitest run src/<file>' or 'vitest run --root <repo>/frontend src/<file>' are correct; './frontend/node_modules/.bin/vitest run frontend/src/<file>' FROM THE REPO ROOT is not — it misses frontend/vite.config's jsdom environment and the suite reports 'Client-only API called on the server side' plus a scatter of 'expected false to be true'. 2026-08-28: a worker ran it that way, saw three failures in terminal-content.test.ts, correctly baselined them as not caused by its change, and reported them as pre-existing. They were not pre-existing — the same file was 221/221 green under the right root. Before reporting a failure as pre-existing or environmental, check the invocation as well as the baseline."
