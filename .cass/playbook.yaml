  - id: b-bd-071
    content: "lesson (nocx, internal/transport tests): readNotification reads through the INBOX (ws_inbox_test.go) and RETAINS a notification seen on the way to the one it was asked for; the older helper DROPPED them. A test that reads past notification A to reach B, then asks for another A, now gets the RETAINED first A rather than a fresh one. Evidence 2026-08-25: TestAgentApprove_ResumedDeltasContinueTheNumbering passed on both parents and failed only on the merge of them — it read the two post-answer deltas assuming suspendedRunWith's read to approvalRequested had consumed the two before it. Fixed by reading all four and asserting the whole sequence off the wire, which is the stronger claim anyway. Expect this shape in any transport test written before main's inbox rewrite."
