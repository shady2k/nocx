  - id: b-bd-101
    content: "nocx sandbox: model it as an ADR-0020 grant, never as a flag on the pane. ADR-0020 §5 already decided the shape — the workspace mints a default grant from its policy and is NOT the enforcement object, because dragging a tab must never silently confer or revoke authority. PR #91 used panes.ephemeral (a boolean naming the consequence) and went back to draft for it on 2026-08-21. Ruled out and recorded in nocx-a0qhd so nobody re-derives them: PaneKind (orthogonal; SSH sandboxing is coming), EnvironmentKind (a sandbox constrains a place, it is not one), no pane row at all (leaves entries.pane_id null and the tab ungrouped), closed_at (window membership, enforced live by renderFromLayout dropping any pane whose row left layout.panes()), and a single-column pane_sandbox table."
