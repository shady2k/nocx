  - id: b-bd-083
    content: "lesson (Orca worker waves, nocx): 'orchestration check --wait' returns ONE message per call, so a supervisor loop must iterate at least once per worker that MIGHT report — not once per worker you personally dispatched. I looped twice for my two workers while five had been dispatched (three by someone else), so three worker_done reports and one escalation sat unread. Consequences compounded: I invented a false 'workers overran their scope' narrative for work that was properly assigned, wrote that falsehood into two commit messages, 'discovered' a tsc break a worker had already escalated to me about and I never answered, and claimed a worker hid the B.5 geometry gap when its report disclosed it precisely — including the real cause (TerminalRenderer has no entry point accepting an externally supplied rectangle). Always run 'orchestration check --all --json' (non-consuming) to see the full mail history before drawing any conclusion about what workers did, and loop the supervisor with slack: a timeout is a checkpoint, not a failure."
