  - id: b-bd-002
    content: "2026-08-26, nocx on this VM: a pre-commit gate that prints 'FAIL: <gate>' with NO findings above it is usually the OOM reaper, not a defect. Measured: 'sh -c cd frontend && npm run lint' exited 143 (SIGTERM) after 4 lines of output, while the same eslint run alone finished in 34s with exit 0 and zero errors. The box has 11 GB RAM with 4 of 5 GB swap in use, systemd-oomd is running, and the kernel log showed a global OOM kill of another agent's chrome-headless in the same minute. Rule: exit 137 or 143 with no diagnostic output is not a test result — re-run the gates ONE AT A TIME before believing them, and never 'fix' code on that evidence. Related: 2026-08-14-pre-commit-starts-two-docker, nocx-x6z3."
