  - id: b-bd-080
    content: "lesson (Orca orchestration, nocx): 'orchestration check' is scoped to the CURRENT TERMINAL, so 'check --all' means 'all messages FOR ME', not 'all recipients'. 'orchestration inbox' is the across-recipients view. This matters after a runtime restart, because your own pane handle changes: 19 messages addressed to my pre-restart handle became invisible to check, and I told the user the orchestration mail had been wiped. It had not — inbox showed all 20, and my supervisor was correctly catching new ones addressed to the new handle. So after any restart: re-resolve your own handle from 'terminal list', reconcile with 'inbox', and only then trust 'check'. Symmetric with the stale-handle rule for panes: an empty 'check' means 'wrong identity' at least as often as 'no messages', exactly as an empty 'terminal read' means 'stale handle' at least as often as 'dead worker'."
