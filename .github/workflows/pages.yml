# The landing page. No build step by design: site/ is hand-written static
# files, and keeping npm out of this job keeps it clear of the containerized
# runners that already serialize on one Docker daemon (nocx-x6z3).
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.sh'
      - 'scripts/site-forbidden-phrases.txt'
      - '.github/workflows/pages.yml'
  # A release alone must refresh the page: the version and date are written
  # into the HTML, so without a release-side trigger the site keeps advertising
  # the previous release until somebody happens to touch site/.
  #
  # THAT NEEDS TWO TRIGGERS, AND THE OBVIOUS ONE IS THE DEAD ONE. `release:
  # published` never fires for our own releases: release.yml creates them with
  # `gh release create` under GH_TOKEN: ${{ github.token }}, and GitHub does
  # not start a workflow from an event a GITHUB_TOKEN produced — the documented
  # anti-recursion rule. So the trigger written for exactly this purpose was
  # inert for the only way this repository actually ships. Measured on v0.3.0:
  # the release published at 2026-08-28T12:45:04Z, no pages run followed, and
  # the live page went on serving v0.2.0 while the repository held v0.3.0.
  #
  # `workflow_run` is about a WORKFLOW finishing rather than a release being
  # published, so the anti-recursion rule does not reach it. It checks out the
  # default branch, which is what this job wants anyway: the page it deploys is
  # main's, and the tag the stamp reads is the one release.yml just built from.
  # The conclusion guard is on the job — workflow_run fires on completion, not
  # on success, and a failed release must not redeploy anything.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Kept for a release published BY HAND through the UI, where the actor is a
  # person and the event does fire. Harmless when it does not.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queue rather than cancel: a superseded run has
# already been merged to main, so its content is not stale, it is early.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on completion whatever the conclusion, so a release
    # that failed in build-macos must not publish a page claiming the version
    # it never finished. Every other trigger is unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version stamp below

      # The page states a version and a release date. They are committed so a
      # local preview is truthful, and rewritten here so a release that never
      # touched site/ still updates the live page. Both pages carry them in
      # data-version and data-released.
      #
      # This step is why the committed value may be AHEAD of the newest tag and
      # check-site.sh only refuses it falling behind. The landing is part of a
      # release, so the copy describing vNEXT is merged before vNEXT is tagged;
      # between those two moments the file says vNEXT and this step publishes
      # the tag that exists. A visitor therefore never meets a download button
      # pointing at a tag nobody can fetch, and the repository can still hold
      # the release it is preparing.
      - name: stamp the released version
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          date="$(git log -1 --format=%cs "$tag")"
          echo "stamping $tag ($date)"
          for f in site/index.html site/ru/index.html; do
            perl -0pi -e "s{(<b data-version>)[^<]*(</b>)}{\${1}$tag\${2}}g" "$f"
            perl -0pi -e "s{(<span data-released>)[^<]*(</span>)}{\${1}$date\${2}}g" "$f"
            perl -0pi -e "s{(<span data-version>)([^v<]*)v[0-9]+\.[0-9]+\.[0-9]+(</span>)}{\${1}\${2}$tag\${3}}g" "$f"
          done
          grep -o 'data-version>[^<]*' site/index.html

      # The same gate the pre-commit hook runs. A page that fails it must not
      # reach the public URL just because someone bypassed a local hook.
      - name: check-site
        run: ./scripts/check-site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
