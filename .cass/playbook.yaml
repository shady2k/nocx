  - id: b-bd-045
    content: "herdr worker waves: putting the completion sentinel in a BRIEF FILE does not stop it matching itself. The skill's defence assumes the sentinel never enters the pane as text, but a claude/codex worker PRINTS the file it reads as tool output, so 'WORKER_DONE::<id>' appears on screen seconds after dispatch and watch.py --regex fires immediately. Measured 2026-08-23: both wave-2 sentinels matched at 7-13s with both worktrees empty and both agents still 'working'; the matched_line was the brief's own indented text. Wait on LIFECYCLE STATUS instead — watch.py --pane <p> --status idle --status done --status blocked — because a status cannot be echoed by a file read, then confirm from the worktree with git log/status before believing anything. The sentinel is still worth having as a report marker; it is not a wake signal."
