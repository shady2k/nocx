  - id: b-bd-029
    content: "VM->Mac browser dev loop (no git in the loop): start backend via /tmp/nocx-devharness.sh (sets SHELL=bash first — pty_local.go spawns the shell from the backend's $SHELL env, and a /bin/sh backend env yields a POSIX sh that never sources ~/.bashrc, so shell integration and OSC 133 blocks silently never engage). Stack: devharness (random WSPORT) + socat TCP-LISTEN:9876 -> WSPORT (system-installed) + cd frontend && npx vite --host (:5174; worker's headless vite holds 5173). NixOS firewall blocks inbound 5174/9876 — do NOT open it; the Mac forwards both via Orca Ports tab (Cmd+Shift+I) over the existing SSH connection. The frontend reaches WS cross-host via an UNCOMMITTED edit: ipc.ts connect(port, host) + main.ts plain-browser fallback passes location.hostname (fallback port 9876). Spike page: http://localhost:5174/spike.html (Connect, WSPORT 9876). Kill devharness by numeric pid — pkill -f matches your own command line and kills your shell."
