  - id: b-bd-043
    content: "herdr worker waves: do NOT run your own verification while workers are running theirs. Measured 2026-08-26: five concurrent vitest processes at ~90% CPU each pushed load average to 79, and the frontend suite reported 21 failures including 'Radio renders an unchecked radio by default' taking 22.5 SECONDS - a kit test in an unrelated area. Two earlier runs of an identical tree gave 3 and then 1 failure. Every one was load, none was code, and each cost a re-run plus the risk of blaming a refactor. The coordinator's verification belongs AFTER the wave settles, run once, serially. AGENTS.md says the same about containerized jobs serializing on one daemon; it is true of plain local runs too."
