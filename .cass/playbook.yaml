  - id: b-bd-103
    content: "nocx themes: adding one is FOUR edits, not one — the CSS file in frontend/src/styles/themes/<id>.css, the @import in frontend/src/style.css, KNOWN_THEME_IDS in frontend/src/renderers/theme-bootstrap.ts, and the ui.theme Options in internal/settings/settings.go. Missing any of the last three fails SILENTLY: data-theme flips, no rule matches, every token keeps the default value and the app just stays Tokyo Night. Gates that catch it: frontend/src/theme-catalogue.test.ts (the two frontend registrations + token parity with tokyo-night + WCAG contrast) and internal/settings/theme_catalogue_test.go (the Go one). e2e/theme-switch.spec.ts reads a resolved token from the running bundle, because a test that greps style.css proves somebody wrote the @import, not that the bundler resolved it. Accurate ANSI palettes for ~29 popular themes are at /home/dev/repos/orca/src/renderer/src/lib/terminal-themes/ — copy them, do not eyeball from screenshots. Contrast floors are 4.5:1 text on every background and 3:1 border/accent on canvas; when a palette fails, move --color-surface-raised rather than the text, because these themes use their selection colour as the raised surface and lightening the text collapses the muted/dim distinction. (nocx-7o42, 2026-07-29)"
