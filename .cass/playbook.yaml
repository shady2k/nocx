  - id: b-bd-010
    content: "A second implementation of one concept is a regression with a delay fuse: the two agree everywhere anyone looks and disagree in the one state nobody tried. 2026-08-05, nocx-v03i: 'am I in an ssh context' existed as commandWord(ctx) in suggest/providers.ts and as /\\bssh\\s+/ in editor.ts; they diverged only for 'ssh' with no trailing space, which is exactly the state a user is in when they press Tab instead of the space. Rule now in AGENTS.md 'Look for the existing answer before you write a second one': grep for the concept rather than your name for it, extend the existing answer, and never let two surfaces own the same input."
